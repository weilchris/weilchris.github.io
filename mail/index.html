<style id="sc-public-form-css">
.sc-form-section{
  position:relative;
  box-sizing:border-box;
}
.sc-form-section *,
.sc-form-section *::before,
.sc-form-section *::after{
  box-sizing:border-box;
}

.sc-generated-form{
  --sc-form-field-bg:#ffffff;
  --sc-form-field-text:#000000;
  --sc-form-accent:#ff9000;
  width:100%;
}

.sc-generated-form .sc-form-row{
  margin:0 0 16px;
}

.sc-generated-form .sc-form-control-row > label{
  display:block;
  margin:0 0 6px;
  color:inherit;
}

.sc-generated-form .uk-input,
.sc-generated-form .uk-textarea,
.sc-generated-form .uk-select{
  width:100%;
  background:var(--sc-form-field-bg)!important;
  color:var(--sc-form-field-text)!important;
  border:1px solid color-mix(in srgb,var(--sc-form-field-text) 24%,transparent)!important;
  border-radius:10px!important;
  box-shadow:none!important;
}

.sc-generated-form .uk-input::placeholder,
.sc-generated-form .uk-textarea::placeholder{
  color:color-mix(in srgb,var(--sc-form-field-text) 54%,transparent)!important;
}

.sc-generated-form .uk-checkbox,
.sc-generated-form .uk-radio{
  border-color:var(--sc-form-accent)!important;
}
.sc-generated-form .uk-checkbox:checked,
.sc-generated-form .uk-radio:checked{
  background-color:var(--sc-form-accent)!important;
  border-color:var(--sc-form-accent)!important;
}
.sc-generated-form a{
  color:var(--sc-form-accent)!important;
}
.sc-generated-form a:hover{
  color:var(--sc-form-accent)!important;
  opacity:.75;
}

/* STACKED — labels above controls */
.sc-generated-form.sc-form-style-stacked .sc-form-control-row{
  display:block!important;
}

/* MINIMAL — same layout, intentionally reduced to underline fields */
.sc-generated-form.sc-form-style-minimal .sc-form-control-row{
  display:block!important;
}
.sc-generated-form.sc-form-style-minimal .uk-input,
.sc-generated-form.sc-form-style-minimal .uk-textarea,
.sc-generated-form.sc-form-style-minimal .uk-select{
  border-radius:0!important;
  border:0!important;
  border-bottom:2px solid var(--sc-form-field-text)!important;
  background:transparent!important;
  padding-left:0!important;
  padding-right:0!important;
}

/* TWO COLUMNS — fields flow in two columns, collapse to one on mobile */
.sc-generated-form.sc-form-style-horizontal fieldset{
  display:grid!important;
  grid-template-columns:repeat(2,minmax(0,1fr))!important;
  column-gap:18px!important;
  row-gap:0!important;
}
.sc-generated-form.sc-form-style-horizontal .sc-form-control-row{
  display:block!important;
  min-width:0!important;
}
.sc-generated-form.sc-form-style-horizontal .sc-form-control-row > label{
  display:block!important;
  margin:0 0 6px!important;
}
/* Structural / choice / submit rows span the full form width. */
.sc-generated-form.sc-form-style-horizontal .sc-form-row:not(.sc-form-control-row),
.sc-generated-form.sc-form-style-horizontal .sc-form-submit-wrap{
  grid-column:1/-1!important;
}

.sc-generated-form .sc-form-submit-wrap{
  margin-top:24px;
}

/* EXACT global CORE CTA classes; no Form-specific look. */
.sc-generated-form .sc-core-cta{
  appearance:none!important;
  -webkit-appearance:none!important;
  display:inline-flex!important;
  align-items:center!important;
  justify-content:center!important;
  box-sizing:border-box!important;

  min-height:52px!important;
  padding:0 46px!important;
  margin-top:18px!important;

  border-radius:25px!important;

  font:inherit!important;
  font-size:16px!important;
  font-weight:500!important;
  line-height:1.2!important;
  text-align:center!important;
  text-decoration:none!important;
  text-transform:none!important;
  letter-spacing:normal!important;

  cursor:pointer!important;
  transition:
    background .18s ease,
    color .18s ease,
    border-color .18s ease,
    opacity .18s ease,
    filter .18s ease,
    transform .18s ease!important;
}

/* Exact five global CORE Form button states */
.sc-generated-form .sc-core-cta-default{
  background:transparent!important;
  color:#ffffff!important;
  border:1px solid #ffffff!important;
}
.sc-generated-form .sc-core-cta-default:hover{
  background:#ffffff!important;
  color:#000000!important;
  border-color:#ffffff!important;
}

.sc-generated-form .sc-core-cta-light{
  background:#ffffff!important;
  color:#000000!important;
  border:0!important;
}
.sc-generated-form .sc-core-cta-light:hover{
  background:#000000!important;
  color:#ffffff!important;
}

.sc-generated-form .sc-core-cta-dark{
  background:#000000!important;
  color:#ffffff!important;
  border:0!important;
}
.sc-generated-form .sc-core-cta-dark:hover{
  background:#ffffff!important;
  color:#000000!important;
}

.sc-generated-form .sc-core-cta-text{
  position:relative!important;
  display:inline-flex!important;
  min-height:auto!important;
  padding:5px 1px!important;
  margin-top:18px!important;
  background:transparent!important;
  color:#ffffff!important;
  border:0!important;
  border-radius:0!important;
  font-size:1.35rem!important;
  line-height:1.35!important;
  text-decoration:none!important;
}
.sc-generated-form .sc-core-cta-text::after{
  content:"";
  position:absolute;
  left:0;
  right:100%;
  bottom:0;
  height:1px;
  background:currentColor;
  transition:right .25s ease-out;
}
.sc-generated-form .sc-core-cta-text:hover::after{
  right:0;
}
.sc-generated-form .sc-core-cta-text:hover{
  color:#ffffff!important;
  opacity:1!important;
}

.sc-generated-form .sc-core-cta.sc-core-cta-custom,
.sc-generated-form .sc-core-cta-custom{
  background:var(--sc-btn-bg,#ff7a00)!important;
  color:var(--sc-btn-text,#ffffff)!important;
  border-color:var(--sc-btn-bg,#ff7a00)!important;
}
.sc-generated-form .sc-core-cta.sc-core-cta-custom:hover,
.sc-generated-form .sc-core-cta-custom:hover{
  background:var(--sc-btn-text,#ffffff)!important;
  color:var(--sc-btn-bg,#ff7a00)!important;
  border-color:var(--sc-btn-text,#ffffff)!important;
  filter:none!important;
}

/* Form Builder mirrors the SAME three layout modes without changing editor tools. */
#form-modal #form-fields-list.sc-form-style-stacked .sc-form-field-options,
#form-modal #form-fields-list.sc-form-style-minimal .sc-form-field-options{

}
#form-modal #form-fields-list.sc-form-style-minimal .sc-form-field-card{

}
#form-modal #form-fields-list.sc-form-style-horizontal .sc-form-field-options{

}



/* Button parity across Live Editor / Preview / Export */

  height:auto!important;
  padding:0 46px!important;
  margin-top:18px!important;

}

  min-height:auto!important;

}
.sc-generated-form .sc-core-cta-custom:hover{

/* Styled File input — same five CORE button styles */
.sc-generated-form .sc-file-control{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}
.sc-generated-form .sc-file-native{

/* Accent is the universal Form focus color */
.sc-generated-form .uk-input:focus,
.sc-generated-form .uk-textarea:focus,
.sc-generated-form .uk-select:focus{
  border-color:var(--sc-form-accent)!important;
  outline:0!important;
  box-shadow:0 0 0 1px var(--sc-form-accent)!important;
}

.sc-generated-form.sc-form-style-minimal .uk-input:focus,
.sc-generated-form.sc-form-style-minimal .uk-textarea:focus,
.sc-generated-form.sc-form-style-minimal .uk-select:focus{

}

.sc-generated-form .uk-checkbox:focus,
.sc-generated-form .uk-radio:focus{
  border-color:var(--sc-form-accent)!important;
  box-shadow:0 0 0 2px color-mix(in srgb,var(--sc-form-accent) 28%,transparent)!important;
  outline:0!important;
}

.sc-generated-form a:focus,

<!-- Mobile Menu (Preview/Export) -->
<div id="mobile-menu-toggle" aria-label="Toggle mobile menu">
  <div class="bar bar1"></div>
  <div class="bar bar2"></div>
</div>
<div id="mobile-menu" aria-hidden="true"></div>
<script>
(function(){
  var toggle = document.getElementById('mobile-menu-toggle');
  var menu = document.getElementById('mobile-menu');
  if (!toggle || !menu) return;

  function build(){
    var nav = document.querySelector('nav.uk-navbar-container ul.navbar-scroll');
    if (!nav) return;

    // Sync colors from navbar (matches app2 behavior)
    try {
      var navbarBg = getComputedStyle(nav.parentElement).backgroundColor;
      var navbarText = getComputedStyle(nav).color;
      document.documentElement.style.setProperty('--navbar-bg-color', navbarBg);
      document.documentElement.style.setProperty('--navbar-text-color', navbarText);
      document.documentElement.style.setProperty('--navbar-link-color', navbarText);
    } catch(e) {}
    // Build a simple vertical menu from the navbar links
    var ul = document.createElement('ul');
    ul.className = 'uk-nav uk-nav-default';
    nav.querySelectorAll('li a').forEach(function(a){
      var li = document.createElement('li');
      var link = a.cloneNode(true);
      li.appendChild(link);
      ul.appendChild(li);
    });
    menu.innerHTML = '';
    menu.appendChild(ul);
  }

  function setOpen(state){
    if (state){
      build();
      menu.classList.add('show');
      menu.setAttribute('aria-hidden','false');
      toggle.classList.add('open');
      toggle.setAttribute('aria-expanded','true');
    } else {
      menu.classList.remove('show');
      menu.setAttribute('aria-hidden','true');
      toggle.classList.remove('open');
      toggle.setAttribute('aria-expanded','false');
    }
  }
  function isOpen(){ return menu.classList.contains('show'); }

  toggle.addEventListener('click', function(){
    setOpen(!isOpen());
  });

  // Close on outside click
  document.addEventListener('click', function(e){
    if (!isOpen()) return;
    if (toggle === e.target || toggle.contains(e.target)) return;
    if (menu.contains(e.target)) return;
    setOpen(false);
  });

  // Close on link click
  menu.addEventListener('click', function(e){
    var a = e.target && e.target.closest && e.target.closest('a');
    if (a) setOpen(false);
  });

  // Rebuild on load (and after global links refresh)
  window.addEventListener('load', function(){ build(); });

  // Close if resizing up
  window.addEventListener('resize', function(){
    if (window.innerWidth > 1024) setOpen(false);
  });

  // Expose a tiny hook used by global-links loader (safe no-op elsewhere)
  window.__rebuildMobileMenu = build;
})();
</script>

<script id="sc-protected-mail-runtime">
(function(){
  var KEY=0x5A;

  function decode(hex){
    try{
      var bytes=[];
      String(hex||'').replace(/../g,function(pair){
        bytes.push((parseInt(pair,16)^KEY)&255);
        return pair;
      });
      if(window.TextDecoder) return new TextDecoder().decode(new Uint8Array(bytes));
      var bin='';
      for(var i=0;i<bytes.length;i++) bin+=String.fromCharCode(bytes[i]);
      try{return decodeURIComponent(escape(bin));}catch(_){return bin;}
    }catch(_){return '';}
  }

  function collectMailBody(form){
    var fd=new FormData(form);
    var lines=[];
    fd.forEach(function(value,key){
      if(value instanceof File){
        if(value && value.name) lines.push(key+': '+value.name);
      }else{
        lines.push(key+': '+String(value));
      }
    });
    return lines.join('\n');
  }

  function bindMailtoForm(form){
    if(!form || form.dataset.scMailBound==='1') return;
    form.dataset.scMailBound='1';

    form.addEventListener('submit',function(ev){
      ev.preventDefault();
      ev.stopPropagation();

      var email=decode(form.getAttribute('data-sc-protected-mail'));
      if(!email) return false;

      var subject=form.getAttribute('data-sc-mail-subject')||'';
      var body=collectMailBody(form);

      window.location.href='mailto:'+email
        +'?subject='+encodeURIComponent(subject)
        +'&body='+encodeURIComponent(body);

      return false;
    });
  }

  function activate(root){
    root=root||document;

    root.querySelectorAll('[data-sc-protected-mail]').forEach(function(el){
      var email=decode(el.getAttribute('data-sc-protected-mail'));
      if(!email) return;

      if(el.matches('a')){
        el.setAttribute('href','mailto:'+email);
        var target=el.querySelector('[data-sc-protected-mail-text]');
        if(target) target.textContent=email;
      }

      if(el.matches('form[data-sc-delivery="mailto"]')){
        el.removeAttribute('action');
        el.removeAttribute('method');
        bindMailtoForm(el);
      }
    });
  }

  function boot(){
    activate(document);

    if(window.MutationObserver){
      var observer=new MutationObserver(function(records){
        records.forEach(function(record){
          record.addedNodes.forEach(function(node){
            if(node && node.nodeType===1) activate(node);
          });
        });
      });
      observer.observe(document.documentElement,{childList:true,subtree:true});
    }
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',boot,{once:true});
  }else{
    boot();
  }
})();
</script>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const mobileMenuToggle = document.getElementById('mobile-menu-toggle');
  const mobileMenu = document.getElementById('mobile-menu');
  if (!mobileMenuToggle || !mobileMenu) return;

  // If the lightweight Mobile Menu (Preview/Export) script already initialized,
  // avoid binding a second controller (prevents open-then-immediate-close).
  if (typeof window.__rebuildMobileMenu === 'function') return;

  // Detect navbar container dynamically
  let dynamicNavContainer = document.getElementById('dynamic-navbar-container');
  if (!dynamicNavContainer) {
    // fallback for Preview / Export
    dynamicNavContainer = document.querySelector('nav.uk-navbar-container');
  }
  if (!dynamicNavContainer) return; // no navbar found

  let menuBuilt = false;

  // Helpers
  const isSmallScreen = () => window.innerWidth <= 1024;
  const isMenuOpen = () => mobileMenu.classList.contains('show');

  const isNavbarEnabled = () => {
    // Editor: checkbox enabled
    const enableNavbarCheckbox = document.getElementById('enable-navbar');
    return enableNavbarCheckbox ? enableNavbarCheckbox.checked : true; // Preview: always enabled
  };

  // Populate mobile menu
  function populateMobileMenu(force = false) {
    if (!force && (menuBuilt || isMenuOpen())) return;

    const nav = dynamicNavContainer.querySelector('ul.navbar-scroll');
    if (!nav || !mobileMenu) return;

    // Update colors
    const navbarBg = getComputedStyle(nav.parentElement || nav).backgroundColor;
    const navbarText = getComputedStyle(nav).color;
    document.documentElement.style.setProperty('--navbar-bg-color', navbarBg);
    document.documentElement.style.setProperty('--navbar-text-color', navbarText);
    document.documentElement.style.setProperty('--navbar-link-color', navbarText);

    const fragment = document.createDocumentFragment();
    mobileMenu.innerHTML = '';

    nav.querySelectorAll('a').forEach(link => {
      const clone = link.cloneNode(true);
      clone.removeAttribute('id');

      clone.addEventListener('click', e => {
        e.stopPropagation();
        closeMobileMenu();
      });

      fragment.appendChild(clone);
    });

    mobileMenu.appendChild(fragment);
    menuBuilt = true;
  }

  // Open / Close Menu
  function openMobileMenu() {
    populateMobileMenu(true);
    mobileMenu.classList.add('show');
    mobileMenuToggle.classList.add('open');
    mobileMenu.setAttribute('aria-hidden', 'false');
  }

  function closeMobileMenu() {
    mobileMenu.classList.remove('show');
    mobileMenuToggle.classList.remove('open');
    mobileMenu.setAttribute('aria-hidden', 'true');
    setTimeout(() => {
      menuBuilt = false; // rebuild next time
    }, 350); // match CSS transition
  }

  // Update visibility
  function updateMobileMenuVisibility() {
    if (isNavbarEnabled() && isSmallScreen()) {
      mobileMenuToggle.style.display = 'flex';
    } else {
      mobileMenuToggle.style.display = 'none';
      closeMobileMenu();
    }
  }

  // MutationObserver to detect dynamic changes in navbar
  if (dynamicNavContainer) {
    const observer = new MutationObserver(() => {
      if (isMenuOpen()) return;
      menuBuilt = false;
      populateMobileMenu(true);
    });
    observer.observe(dynamicNavContainer, { childList: true, subtree: false });
  }

  // Events
  mobileMenuToggle.addEventListener('click', () => {
    isMenuOpen() ? closeMobileMenu() : openMobileMenu();
  });
  window.addEventListener('resize', updateMobileMenuVisibility);

  const enableNavbarCheckbox = document.getElementById('enable-navbar');
  enableNavbarCheckbox?.addEventListener('change', () => {
    menuBuilt = false;
    populateMobileMenu(true);
    updateMobileMenuVisibility();
  });

  // Initial setup
  populateMobileMenu(true);
  updateMobileMenuVisibility();
});
</script>
<script>
/* CORE universal local-service notice
   Works in Preview/blob:, exported file:// pages, dynamic Lightboxes,
   Slideshow, Add Video, and same-origin/srcdoc Embed documents. */
(function(){
  function isLocalContext(win){
    try {
      var p=String((win||window).location.protocol||'');
      return !(p === 'http:' || p === 'https:');
    } catch(e) {
      return true;
    }
  }

  function isYouTubeSrc(src){
    var s=String(src||'').toLowerCase();
    return s.indexOf('youtube.com/embed/') !== -1 ||
           s.indexOf('youtube-nocookie.com/embed/') !== -1 ||
           s.indexOf('youtube.com/watch?') !== -1 ||
           s.indexOf('youtu.be/') !== -1;
  }

  function warningText(){
    return '<span style="display:block;white-space:normal;">YouTube does not allow local playback.<br>Upload the website to a server to play this video.</span>';
  }

  function ensurePositioned(el, win){
    try {
      if ((win||window).getComputedStyle(el).position === 'static') el.style.position='relative';
    } catch(e) {
      if (!el.style.position) el.style.position='relative';
    }
  }

  function decorateYouTubeFrame(frame, doc, win){
    if (!frame || frame.dataset.scLocalYoutubeDone === '1') return;
    var src=String(frame.getAttribute('src')||'');
    if (!isYouTubeSrc(src)) return;

    frame.dataset.scLocalYoutubeDone='1';

    var isFull = frame.classList.contains('sc-youtube-fullscreen-player');
    var isSlider = frame.classList.contains('sc-slider-youtube-player');
    var inLightbox = !!frame.closest('.uk-lightbox');

    var host = frame.parentElement;
    if (!host) return;
    ensurePositioned(host, win);

    // Preserve the errored player so users understand this is a local-playback limitation.
    if (isFull || isSlider) {
      frame.style.filter='blur(14px)';
      frame.style.opacity='.55';
    } else if (inLightbox) {
      frame.style.opacity='.42';
    } else {
      frame.style.opacity='.48';
    }

    var notice=doc.createElement('div');
    notice.className='sc-runtime-youtube-warning';
    notice.innerHTML=warningText();
    notice.style.boxSizing='border-box';
    notice.style.textAlign='center';
    notice.style.color='#fff';
    notice.style.fontWeight='800';
    notice.style.lineHeight='1.25';
    notice.style.letterSpacing='.01em';
    notice.style.pointerEvents='none';

    if (isFull || isSlider) {
      // Fullscreen Add Video + Slideshow: keep the player visible but blurred,
      // and place the warning at the top so headings/subheadings/buttons remain visible.
      notice.style.cssText += ';position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;padding:100px 28px 28px;background:transparent;font-size:clamp(16px,2vw,28px);z-index:2147483000;';
    } else if (inLightbox) {
      notice.style.cssText += ';position:absolute;top:18px;left:50%;transform:translateX(-50%);padding:12px 18px;background:rgba(255,145,0,.92);border-radius:12px;font-size:clamp(13px,1.25vw,18px);max-width:min(760px,calc(100% - 32px));width:max-content;z-index:2147483000;';
    } else {
      // Regular Add Video / custom Embed.
      notice.style.cssText += ';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:28px;background:rgba(255,145,0,.92);font-size:clamp(16px,2vw,28px);z-index:2147483000;';
    }

    host.appendChild(notice);
  }

  function scanDocument(doc, win){
    if (!doc || !isLocalContext(win)) return;

    try {
      doc.querySelectorAll('.sc-formspree-local-warning').forEach(function(notice){
        notice.style.display='flex';
      });
    } catch(e) {}

    try {
      doc.querySelectorAll('iframe').forEach(function(frame){
        var src=String(frame.getAttribute('src')||'');

        // Direct YouTube iframe in Add Video / Slider / Lightbox / custom markup.
        if (isYouTubeSrc(src)) decorateYouTubeFrame(frame,doc,win);

        // Same-origin/srcdoc Embed: scan its inner document too.
        try {
          var innerDoc=frame.contentDocument;
          var innerWin=frame.contentWindow;
          if (innerDoc && innerDoc.documentElement) scanDocument(innerDoc,innerWin);
        } catch(e) {}
      });
    } catch(e) {}
  }

  function scanAll(){
    scanDocument(document,window);
  }

  document.addEventListener('submit',function(e){
    if(!isLocalContext(window)) return;
    var form=e.target;
    if(form && form.matches && form.matches('.sc-generated-form[action*="formspree.io"]')){
      e.preventDefault();
      e.stopPropagation();
    }
  },true);

  document.addEventListener('DOMContentLoaded',function(){
    scanAll();
    setTimeout(scanAll,100);
    setTimeout(scanAll,500);
  });

  window.addEventListener('load',function(){
    scanAll();
    setTimeout(scanAll,300);
    setTimeout(scanAll,1200);
  });

  // UIkit Lightbox and asynchronously generated Embed/Slider iframe content.
  document.addEventListener('click',function(){
    setTimeout(scanAll,50);
    setTimeout(scanAll,250);
    setTimeout(scanAll,700);
  },true);

  try {
    new MutationObserver(function(){
      scanAll();
    }).observe(document.documentElement,{childList:true,subtree:true});
  } catch(e) {}

  // Covers iframe navigations / late srcdoc loading without aggressive polling.
  setInterval(scanAll,1500);
})();
</script>

<script>
(function(){
  function shuffle(el){
    if(!el)return;
    var a=Array.prototype.slice.call(el.children||[]);
    for(var i=a.length-1;i>0;i--){
      var j=Math.floor(Math.random()*(i+1));
      var t=a[i];a[i]=a[j];a[j]=t;
    }
    a.forEach(function(child){el.appendChild(child);});
  }
  function run(){
    document.querySelectorAll('.sc-random-gallery').forEach(function(section){
      var grid=section.querySelector('[uk-lightbox][uk-grid],[uk-grid][uk-lightbox]');
      shuffle(grid);
    });
    document.querySelectorAll('.sc-random-grid').forEach(function(section){
      var grids=Array.prototype.slice.call(section.querySelectorAll('[uk-grid]'));
      var grid=grids.find(function(g){return g.children&&g.children.length>1;});
      shuffle(grid);
    });
    document.querySelectorAll('.sc-random-slider').forEach(function(section){
      shuffle(section.querySelector('.uk-slider-items'));
    });
    try{if(window.UIkit)UIkit.update(document);}catch(e){}
  }
  document.addEventListener('DOMContentLoaded',run);
})();
</script>
<script>
(function(){
  function protect(root){
    if(!root||!root.querySelectorAll)return;
    function mark(el){
      if(!el||el.nodeType!==1)return;
      el.setAttribute('translate','no');
      if(el.classList)el.classList.add('notranslate');
    }
    try{
      if(root.matches&&root.matches('[uk-icon],[data-uk-icon],.uk-icon,.uk-icon-button'))mark(root);
      root.querySelectorAll('[uk-icon],[data-uk-icon],.uk-icon,.uk-icon-button').forEach(mark);
    }catch(e){}
  }
  document.addEventListener('DOMContentLoaded',function(){
    protect(document);
    try{
      new MutationObserver(function(ms){
        ms.forEach(function(m){m.addedNodes.forEach(function(n){if(n&&n.nodeType===1)protect(n);});});
      }).observe(document.documentElement,{childList:true,subtree:true});
    }catch(e){}
  });
})();
</script>

<script>
(function(){
  function bind(el){
    if(!el || el.__boundScrollEnh) return;
    el.__boundScrollEnh = true;

    // Wheel -> horizontal scroll (mouse wheel support)
    el.addEventListener('wheel', function(e){
      // Only convert vertical wheel when horizontal is the intent
      if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
        el.scrollLeft += e.deltaY;
        e.preventDefault();
      }
    }, {passive:false});

    // Drag to scroll (mouse/touchpad)
    var isDown=false, startX=0, startLeft=0, activePointerId=null;
    el.addEventListener('pointerdown', function(e){
      // Only for primary button / touch
      if (e.pointerType === 'mouse' && e.button !== 0) return;

      // IMPORTANT: don't hijack clicks on interactive elements inside the scroller
      // (eg. DropNav parent buttons). Let those receive normal pointer/click events.
      if (e.target && (e.target.closest('a') || e.target.closest('button') || e.target.closest('input') || e.target.closest('select') || e.target.closest('textarea'))) return;

      isDown = true;
      activePointerId = e.pointerId;
      startX = e.clientX;
      startLeft = el.scrollLeft;
      try { el.setPointerCapture(e.pointerId); } catch(_) {}
      el.classList.add('dragging');
    });
    el.addEventListener('pointermove', function(e){
      if(!isDown || (activePointerId !== null && e.pointerId !== activePointerId)) return;
      var dx = e.clientX - startX;
      // Invert so dragging left moves content right
      el.scrollLeft = startLeft - dx;
    });
    function end(e){
      if(activePointerId !== null && e.pointerId !== activePointerId) return;
      isDown=false;
      activePointerId=null;
      el.classList.remove('dragging');
      try { el.releasePointerCapture && e.pointerId!=null && el.releasePointerCapture(e.pointerId); } catch(_) {}
    }
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
    el.addEventListener('pointerleave', end);

    // Avoid text selection while dragging
    el.addEventListener('dragstart', function(e){ e.preventDefault(); });
  }

  function syncHeadingActive(){
    var nav=document.querySelector('.navbar-scroll[data-sc-preview-nav="1"]');
    if(!nav) return;

    var headingLinks=Array.from(nav.querySelectorAll('.sc-page-heading-link > a[href^="#"]'));
    if(!headingLinks.length) return;

    var offset=110;
    var active=null;
    var best=-Infinity;

    headingLinks.forEach(function(a){
      var id=(a.getAttribute('href')||'').slice(1);
      if(!id) return;
      var target=document.getElementById(id);
      if(!target) return;

      var top=target.getBoundingClientRect().top-offset;
      if(top<=0 && top>best){
        best=top;
        active=a;
      }
    });

    // Only heading links participate in scroll state.
    // Page links are NEVER promoted as the "next" scroll target.
    headingLinks.forEach(function(a){
      a.classList.toggle('uk-active',a===active);
    });
  }

  function init(){
    document.querySelectorAll('.dn-scroll, .navbar-scroll').forEach(bind);
    syncHeadingActive();
    window.addEventListener('scroll',syncHeadingActive,{passive:true});
    window.addEventListener('resize',syncHeadingActive);
    window.__scSyncHeadingActive=syncHeadingActive;
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Material Symbols SVG Extractor</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  color:#eee;
  font-family:Arial,Helvetica,sans-serif;
}

.app{
  width:100%;
  height:100vh;
  display:grid;
  grid-template-columns:330px 1fr;
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{
  background:#181818;
  border-right:1px solid #333;
  padding:18px;
  overflow:auto;
}

h1{
  margin:0;
  font-size:20px;
}

.subtitle{
  margin-top:5px;
  color:#777;
  font-size:12px;
  line-height:1.4;
}

label{
  display:block;
  margin-top:17px;
  margin-bottom:6px;
  color:#999;
  font-size:10px;
  letter-spacing:.08em;
  text-transform:uppercase;
}

input[type="text"]{
  width:100%;
  height:38px;
  padding:0 10px;
  border:1px solid #3a3a3a;
  border-radius:7px;
  outline:none;
  background:#222;
  color:#fff;
}

input[type="text"]:focus{
  border-color:#777;
}


/* =========================================================
   STYLE
========================================================= */

.style-buttons{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px;
}

.style-buttons button{
  height:35px;
  border:1px solid #3b3b3b;
  border-radius:6px;
  background:#222;
  color:#aaa;
  cursor:pointer;
}

.style-buttons button.active{
  background:#eee;
  color:#111;
  border-color:#eee;
}


/* =========================================================
   RANGES
========================================================= */

.range-row{
  display:grid;
  grid-template-columns:1fr 55px;
  gap:8px;
  align-items:center;
}

input[type="range"]{
  width:100%;
}

.value{
  padding:6px 3px;
  border:1px solid #333;
  border-radius:6px;
  background:#222;
  text-align:center;
  font-size:12px;
}


/* =========================================================
   SELECTED
========================================================= */

.selected-panel{
  margin-top:22px;
  padding-top:16px;
  border-top:1px solid #333;
}

.selected-name{
  font-size:17px;
  font-weight:bold;
  word-break:break-word;
}

.selected-meta{
  margin-top:6px;
  color:#888;
  font-size:11px;
  line-height:1.55;
}

.preview{
  height:155px;
  margin-top:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid #333;
  border-radius:8px;
  background:#101010;
}

.preview img{
  width:110px;
  height:110px;
  object-fit:contain;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-top:9px;
}

.actions button{
  height:42px;
  border:1px solid #444;
  border-radius:7px;
  background:#252525;
  color:#fff;
  cursor:pointer;
  font-weight:bold;
}

.actions button:hover{
  background:#303030;
}

.status{
  min-height:35px;
  margin-top:9px;
  color:#888;
  font-size:11px;
  line-height:1.4;
}


/* =========================================================
   MAIN
========================================================= */

.main{
  min-width:0;
  display:flex;
  flex-direction:column;
}

.topbar{
  height:58px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  border-bottom:1px solid #333;
  background:#151515;
}

.topbar-title{
  font-weight:bold;
}

.count{
  color:#777;
  font-size:12px;
}

.grid{
  flex:1;
  overflow:auto;
  padding:15px;
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(125px,1fr));
  gap:8px;
}

.card{
  min-height:115px;
  padding:10px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  border:1px solid #2d2d2d;
  border-radius:8px;
  background:#181818;
  cursor:pointer;
  transition:.12s;
}

.card:hover{
  border-color:#555;
  background:#222;
}

.card.selected{
  border-color:#aaa;
  background:#252525;
}

.card img{
  width:44px;
  height:44px;
  object-fit:contain;
}

.card-name{
  width:100%;
  margin-top:12px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  text-align:center;
  color:#999;
  font-size:10px;
}

.loading{
  grid-column:1/-1;
  padding:60px;
  color:#777;
  text-align:center;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:700px){

  .app{
    grid-template-columns:1fr;
  }

  .sidebar{
    position:absolute;
    z-index:10;
    width:310px;
    height:100%;
    transform:translateX(-100%);
    transition:.2s;
  }

  .sidebar.open{
    transform:translateX(0);
  }

}

</style>
</head>


<body>

<div class="app">


<!-- =======================================================
     SIDEBAR
======================================================= -->

<aside class="sidebar">

<h1>Material Symbols → SVG</h1>

<div class="subtitle">
Official Google Material Symbols SVG extractor
</div>


<label>Search</label>

<input
  id="search"
  type="text"
  placeholder="home, arrow, game, volume…"
  autocomplete="off"
>


<label>Style</label>

<div class="style-buttons">

<button
  class="active"
  data-style="Outlined">
Outlined
</button>

<button
  data-style="Rounded">
Rounded
</button>

<button
  data-style="Sharp">
Sharp
</button>

</div>


<label>Fill</label>

<div class="range-row">

<input
  id="fill"
  type="range"
  min="0"
  max="1"
  step="1"
  value="0"
>

<div
  id="fillValue"
  class="value">
0
</div>

</div>


<label>Weight</label>

<div class="range-row">

<input
  id="weight"
  type="range"
  min="100"
  max="700"
  step="100"
  value="400"
>

<div
  id="weightValue"
  class="value">
400
</div>

</div>


<label>Grade</label>

<div class="range-row">

<input
  id="grade"
  type="range"
  min="-25"
  max="200"
  step="25"
  value="0"
>

<div
  id="gradeValue"
  class="value">
0
</div>

</div>


<label>Optical Size</label>

<div class="range-row">

<input
  id="opsz"
  type="range"
  min="20"
  max="48"
  step="1"
  value="24"
>

<div
  id="opszValue"
  class="value">
24
</div>

</div>


<div class="selected-panel">

<div
  id="selectedName"
  class="selected-name">
No icon selected
</div>

<div
  id="selectedMeta"
  class="selected-meta">
Select an icon from the grid.
</div>


<div class="preview">

<div id="previewIcon"></div>

</div>


<div class="actions">

<button id="copySvg">
COPY SVG
</button>

<button id="copyPath">
COPY PATH
</button>

</div>


<div
  id="status"
  class="status">
</div>

</div>

</aside>


<!-- =======================================================
     MAIN
======================================================= -->

<main class="main">

<div class="topbar">

<div class="topbar-title">
Google Material Symbols
</div>

<div
  id="count"
  class="count">
Loading…
</div>

</div>


<div
  id="grid"
  class="grid">

<div class="loading">
Loading Google icon catalogue…
</div>

</div>

</main>

</div>


<script>

/* =========================================================
   GOOGLE METADATA
========================================================= */

const METADATA_URL =
  'https://fonts.google.com/metadata/icons?incomplete=1&key=material_symbols';


/* =========================================================
   STATE
========================================================= */

const state = {

  style:'Outlined',

  fill:0,

  weight:400,

  grade:0,

  opsz:24

};


let icons = [];

let selectedIcon = null;

let googleHost = null;


/* =========================================================
   DOM
========================================================= */

const grid =
  document.getElementById('grid');

const search =
  document.getElementById('search');

const count =
  document.getElementById('count');

const selectedName =
  document.getElementById('selectedName');

const selectedMeta =
  document.getElementById('selectedMeta');

const previewIcon =
  document.getElementById('previewIcon');

const status =
  document.getElementById('status');


/* =========================================================
   METADATA LOADER
========================================================= */

async function loadCatalogue(){

  try{

    status.textContent =
      'Loading Google metadata…';


    const response =
      await fetch(
        METADATA_URL,
        {
          cache:'no-store'
        }
      );


    if(!response.ok){

      throw new Error(
        'Metadata request failed: HTTP ' +
        response.status
      );

    }


    let text =
      await response.text();


    /*
      Google's updater explicitly removes
      the first five characters.
    */

    text =
      text.slice(5);


    const data =
      JSON.parse(text);


    /*
      THIS IS IMPORTANT:

      Do not hard-code fonts.gstatic.com.

      Google supplies the host in metadata.
    */

    googleHost =
      data.host;


    if(!googleHost){

      throw new Error(
        'Google metadata did not provide an asset host.'
      );

    }


    icons =
      Array.isArray(data.icons)
        ? data.icons
        : [];


    icons.sort(
      (a,b) =>
        a.name.localeCompare(b.name)
    );


    count.textContent =
      icons.length.toLocaleString() +
      ' icons';


    status.textContent =
      'Google catalogue loaded.';


    renderGrid();


  }catch(error){

    console.error(
      'Material Symbols loader:',
      error
    );


    grid.innerHTML = '';

    const errorBox =
      document.createElement('div');

    errorBox.className =
      'loading';

    errorBox.innerHTML =
      'Could not load Google icon catalogue.' +
      '<br><br>' +
      escapeHTML(
        error.message
      );


    grid.appendChild(
      errorBox
    );


    count.textContent =
      'Load error';


    status.textContent =
      error.message;

  }

}


/* =========================================================
   STYLE SLUG
========================================================= */

function styleSlug(){

  return (
    'materialsymbols' +
    state.style.toLowerCase()
  );

}


/* =========================================================
   SVG VARIANT
========================================================= */

function assetStyle(){

  let result = '';


  /*
    Weight
  */

  if(
    state.weight !== 400
  ){

    result +=
      'wght' +
      state.weight;

  }


  /*
    Grade

    Google publishes:
      gradN25
      default/empty
      grad200
  */

  if(
    state.grade === -25
  ){

    result +=
      'gradN25';

  }

  else if(
    state.grade === 200
  ){

    result +=
      'grad200';

  }


  /*
    Fill
  */

  if(
    state.fill === 1
  ){

    result +=
      'fill1';

  }


  return result || 'default';

}


/* =========================================================
   OPTICAL SIZE
========================================================= */

function svgSize(){

  /*
    Google publishes SVGs at:
      20
      24
      40
      48

    Convert the continuous control to the nearest
    official SVG size.
  */

  const values =
    [20,24,40,48];


  let closest =
    values[0];


  let distance =
    Math.abs(
      state.opsz - closest
    );


  for(
    const value of values
  ){

    const d =
      Math.abs(
        state.opsz - value
      );


    if(d < distance){

      distance =
        d;

      closest =
        value;

    }

  }


  return closest;

}


/* =========================================================
   GOOGLE SVG URL
========================================================= */

function googleSvgURL(icon){

  if(!googleHost){

    throw new Error(
      'Google asset host has not loaded yet.'
    );

  }


  const family =
    styleSlug();


  const name =
    encodeURIComponent(
      icon.name
    );


  const style =
    assetStyle();


  const size =
    svgSize();


  return (
    'https://' +
    googleHost +
    '/s/i/short-term/release/' +
    family +
    '/' +
    name +
    '/' +
    style +
    '/' +
    size +
    'px.svg'
  );

}


/* =========================================================
   SEARCH
========================================================= */

function matchesSearch(icon){

  const query =
    search.value
      .trim()
      .toLowerCase();


  if(!query)
    return true;


  const searchable =
    [
      icon.name || '',
      ...(icon.tags || []),
      ...(icon.categories || [])
    ]
    .join(' ')
    .toLowerCase();


  return searchable.includes(
    query
  );

}


/* =========================================================
   RENDER GRID
========================================================= */

function renderGrid(){

  if(!googleHost)
    return;


  const filtered =
    icons.filter(
      matchesSearch
    );


  grid.innerHTML =
    '';


  const fragment =
    document.createDocumentFragment();


  /*
    Keep the initial grid responsive.

    Search can narrow the catalogue immediately.
  */

  filtered
    .slice(0,1000)
    .forEach(
      icon => {

        const card =
          document.createElement(
            'div'
          );


        card.className =
          'card';


        if(
          selectedIcon &&
          selectedIcon.name ===
          icon.name
        ){

          card.classList.add(
            'selected'
          );

        }


        const img =
          document.createElement(
            'img'
          );


        img.alt =
          icon.name;


        img.src =
          googleSvgURL(
            icon
          );


        img.onerror =
          () => {

            /*
              If an individual asset isn't
              available, don't kill the grid.
            */

            img.style.visibility =
              'hidden';

          };


        const name =
          document.createElement(
            'div'
          );


        name.className =
          'card-name';


        name.textContent =
          icon.name;


        card.appendChild(
          img
        );


        card.appendChild(
          name
        );


        card.addEventListener(
          'click',
          () => {

            selectIcon(
              icon
            );

          }
        );


        fragment.appendChild(
          card
        );

      }
    );


  grid.appendChild(
    fragment
  );


  count.textContent =
    filtered.length.toLocaleString() +
    ' / ' +
    icons.length.toLocaleString();

}


/* =========================================================
   SELECT ICON
========================================================= */

function selectIcon(icon){

  selectedIcon =
    icon;


  selectedName.textContent =
    icon.name;


  updateSelectedMeta();


  loadSelectedPreview();


  status.textContent =
    'Selected ' +
    icon.name;


  renderGrid();

}


/* =========================================================
   SELECTED META
========================================================= */

function updateSelectedMeta(){

  if(!selectedIcon)
    return;


  selectedMeta.innerHTML =
    'Style: ' +
    state.style +
    '<br>' +
    'Fill: ' +
    state.fill +
    ' · Weight: ' +
    state.weight +
    ' · Grade: ' +
    state.grade +
    ' · Optical Size: ' +
    state.opsz;

}


/* =========================================================
   SELECTED PREVIEW
========================================================= */

function loadSelectedPreview(){

  previewIcon.innerHTML =
    '';


  if(!selectedIcon)
    return;


  const img =
    document.createElement(
      'img'
    );


  img.src =
    googleSvgURL(
      selectedIcon
    );


  img.alt =
    selectedIcon.name;


  img.onload =
    () => {

      status.textContent =
        'Official Google SVG loaded.';

    };


  img.onerror =
    () => {

      status.textContent =
        'This Google SVG variant is unavailable.';

    };


  previewIcon.appendChild(
    img
  );

}


/* =========================================================
   FETCH SVG
========================================================= */

async function fetchSVG(){

  if(!selectedIcon){

    throw new Error(
      'Select an icon first.'
    );

  }


  const url =
    googleSvgURL(
      selectedIcon
    );


  status.textContent =
    'Fetching SVG…';


  const response =
    await fetch(
      url,
      {
        cache:'no-store'
      }
    );


  if(!response.ok){

    throw new Error(
      'SVG request failed: HTTP ' +
      response.status +
      ' — ' +
      url
    );

  }


  const text =
    await response.text();


  if(
    !/<svg[\s>]/i.test(
      text
    )
  ){

    throw new Error(
      'Google returned something other than SVG.'
    );

  }


  return text;

}


/* =========================================================
   CLEAN SVG
========================================================= */

function cleanSVG(svgText){

  const parser =
    new DOMParser();


  const doc =
    parser.parseFromString(
      svgText,
      'image/svg+xml'
    );


  const svg =
    doc.documentElement;


  if(
    svg.nodeName.toLowerCase() !==
    'svg'
  ){

    throw new Error(
      'Invalid SVG document.'
    );

  }


  svg.setAttribute(
    'xmlns',
    'http://www.w3.org/2000/svg'
  );


  if(
    !svg.hasAttribute(
      'viewBox'
    )
  ){

    svg.setAttribute(
      'viewBox',
      '0 0 24 24'
    );

  }


  /*
    Store generator settings as harmless
    data attributes.
  */

  svg.setAttribute(
    'data-material-symbol',
    selectedIcon.name
  );


  svg.setAttribute(
    'data-material-style',
    state.style
  );


  svg.setAttribute(
    'data-material-fill',
    state.fill
  );


  svg.setAttribute(
    'data-material-weight',
    state.weight
  );


  svg.setAttribute(
    'data-material-grade',
    state.grade
  );


  svg.setAttribute(
    'data-material-optical-size',
    state.opsz
  );


  return svg;

}


/* =========================================================
   SERIALIZE
========================================================= */

function serializeSVG(svg){

  return new XMLSerializer()
    .serializeToString(
      svg
    )
    .replace(
      />\s+</g,
      '><'
    );

}


/* =========================================================
   COPY SVG
========================================================= */

document
  .getElementById(
    'copySvg'
  )
  .addEventListener(
    'click',
    async () => {

      try{

        const raw =
          await fetchSVG();


        const svg =
          cleanSVG(
            raw
          );


        const output =
          serializeSVG(
            svg
          );


        await navigator.clipboard
          .writeText(
            output
          );


        status.textContent =
          'SVG copied to clipboard.';


      }
      catch(error){

        console.error(
          error
        );


        status.textContent =
          'SVG extraction error: ' +
          error.message;

      }

    }
  );


/* =========================================================
   COPY PATH
========================================================= */

document
  .getElementById(
    'copyPath'
  )
  .addEventListener(
    'click',
    async () => {

      try{

        const raw =
          await fetchSVG();


        const svg =
          cleanSVG(
            raw
          );


        const paths =
          [
            ...svg.querySelectorAll(
              'path'
            )
          ];


        if(
          !paths.length
        ){

          throw new Error(
            'No <path> element found.'
          );

        }


        const output =
          paths
            .map(
              path =>
                path.getAttribute(
                  'd'
                )
            )
            .filter(Boolean)
            .join('\n');


        await navigator.clipboard
          .writeText(
            output
          );


        status.textContent =
          paths.length +
          ' SVG path' +
          (
            paths.length === 1
              ? ''
              : 's'
          ) +
          ' copied.';


      }
      catch(error){

        console.error(
          error
        );


        status.textContent =
          'PATH extraction error: ' +
          error.message;

      }

    }
  );


/* =========================================================
   SETTINGS
========================================================= */

function updateSettings(){

  state.fill =
    Number(
      document.getElementById(
        'fill'
      ).value
    );


  state.weight =
    Number(
      document.getElementById(
        'weight'
      ).value
    );


  state.grade =
    Number(
      document.getElementById(
        'grade'
      ).value
    );


  state.opsz =
    Number(
      document.getElementById(
        'opsz'
      ).value
    );


  document.getElementById(
    'fillValue'
  ).textContent =
    state.fill;


  document.getElementById(
    'weightValue'
  ).textContent =
    state.weight;


  document.getElementById(
    'gradeValue'
  ).textContent =
    state.grade;


  document.getElementById(
    'opszValue'
  ).textContent =
    state.opsz;


  updateSelectedMeta();


  if(
    selectedIcon
  ){

    loadSelectedPreview();

  }


  renderGrid();

}


/* =========================================================
   RANGE EVENTS
========================================================= */

[
  'fill',
  'weight',
  'grade',
  'opsz'
]
.forEach(
  id => {

    document
      .getElementById(
        id
      )
      .addEventListener(
        'input',
        updateSettings
      );

  }
);


/* =========================================================
   STYLE EVENTS
========================================================= */

document
  .querySelectorAll(
    '.style-buttons button'
  )
  .forEach(
    button => {

      button.addEventListener(
        'click',
        () => {

          document
            .querySelectorAll(
              '.style-buttons button'
            )
            .forEach(
              b =>
                b.classList.remove(
                  'active'
                )
            );


          button.classList.add(
            'active'
          );


          state.style =
            button.dataset.style;


          updateSelectedMeta();


          if(
            selectedIcon
          ){

            loadSelectedPreview();

          }


          renderGrid();

        }
      );

    }
  );


/* =========================================================
   SEARCH
========================================================= */

let searchTimer;


search.addEventListener(
  'input',
  () => {

    clearTimeout(
      searchTimer
    );


    searchTimer =
      setTimeout(
        renderGrid,
        50
      );

  }
);


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

  return String(value)
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );

}


/* =========================================================
   START
========================================================= */

loadCatalogue();

</script>

</body>
</html>

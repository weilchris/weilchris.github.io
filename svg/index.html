<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Material Symbols SVG Extractor</title>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  color:#eee;
  font-family:Arial,Helvetica,sans-serif;
}

.app{
  width:100%;
  height:100vh;
  display:grid;
  grid-template-columns:330px 1fr;
}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{
  background:#181818;
  border-right:1px solid #333;
  padding:18px;
  overflow:auto;
}

h1{
  margin:0;
  font-size:20px;
}

.subtitle{
  margin-top:5px;
  color:#777;
  font-size:12px;
  line-height:1.4;
}

label{
  display:block;
  margin-top:17px;
  margin-bottom:6px;
  color:#999;
  font-size:10px;
  letter-spacing:.08em;
  text-transform:uppercase;
}

input[type="text"]{
  width:100%;
  height:38px;
  padding:0 10px;
  border:1px solid #3a3a3a;
  border-radius:7px;
  outline:none;
  background:#222;
  color:#fff;
}

input[type="text"]:focus{
  border-color:#777;
}

/* =========================================================
   STYLE
========================================================= */

.style-buttons{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px;
}

.style-buttons button{
  height:35px;
  border:1px solid #3b3b3b;
  border-radius:6px;
  background:#222;
  color:#aaa;
  cursor:pointer;
}

.style-buttons button.active{
  background:#eee;
  color:#111;
  border-color:#eee;
}

/* =========================================================
   RANGES
========================================================= */

.range-row{
  display:grid;
  grid-template-columns:1fr 55px;
  gap:8px;
  align-items:center;
}

input[type="range"]{
  width:100%;
}

.value{
  padding:6px 3px;
  border:1px solid #333;
  border-radius:6px;
  background:#222;
  text-align:center;
  font-size:12px;
}

/* =========================================================
   SELECTED
========================================================= */

.selected-panel{
  margin-top:22px;
  padding-top:16px;
  border-top:1px solid #333;
}

.selected-name{
  font-size:17px;
  font-weight:bold;
  word-break:break-word;
}

.selected-meta{
  margin-top:6px;
  color:#888;
  font-size:11px;
  line-height:1.55;
}

.preview{
  height:155px;
  margin-top:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid #333;
  border-radius:8px;
  background:#101010;
}

.preview svg{
  width:110px;
  height:110px;
  fill:currentColor;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-top:9px;
}

.actions button{
  height:42px;
  border:1px solid #444;
  border-radius:7px;
  background:#252525;
  color:#fff;
  cursor:pointer;
  font-weight:bold;
}

.actions button:hover{
  background:#303030;
}

.status{
  min-height:35px;
  margin-top:9px;
  color:#888;
  font-size:11px;
  line-height:1.4;
}

/* =========================================================
   MAIN
========================================================= */

.main{
  min-width:0;
  display:flex;
  flex-direction:column;
}

.topbar{
  height:58px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  border-bottom:1px solid #333;
  background:#151515;
}

.topbar-title{
  font-weight:bold;
}

.count{
  color:#777;
  font-size:12px;
}

.grid{
  flex:1;
  overflow:auto;
  padding:15px;
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(125px,1fr));
  gap:8px;
}

.card{
  min-height:115px;
  padding:10px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  border:1px solid #2d2d2d;
  border-radius:8px;
  background:#181818;
  cursor:pointer;
  transition:.12s;
}

.card:hover{
  border-color:#555;
  background:#222;
}

.card.selected{
  border-color:#aaa;
  background:#252525;
}

.card svg{
  width:44px;
  height:44px;
  fill:currentColor;
}

.card-name{
  width:100%;
  margin-top:12px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  text-align:center;
  color:#999;
  font-size:10px;
}

.loading{
  grid-column:1/-1;
  padding:60px;
  color:#777;
  text-align:center;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:700px){

  .app{
    grid-template-columns:1fr;
  }

  .sidebar{
    position:absolute;
    z-index:10;
    width:310px;
    height:100%;
    transform:translateX(-100%);
    transition:.2s;
  }

  .sidebar.open{
    transform:translateX(0);
  }
}
</style>
</head>

<body>

<div class="app">

<!-- =======================================================
     SIDEBAR
======================================================= -->

<aside class="sidebar">

  <h1>Material Symbols → SVG</h1>

  <div class="subtitle">
    Official Google Material Symbols SVG extractor
  </div>


  <label>Search</label>

  <input
    id="search"
    type="text"
    placeholder="home, arrow, game, volume…"
    autocomplete="off"
  >


  <label>Style</label>

  <div class="style-buttons">

    <button
      class="active"
      data-style="Outlined">
      Outlined
    </button>

    <button
      data-style="Rounded">
      Rounded
    </button>

    <button
      data-style="Sharp">
      Sharp
    </button>

  </div>


  <label>Fill</label>

  <div class="range-row">

    <input
      id="fill"
      type="range"
      min="0"
      max="1"
      step="1"
      value="0"
    >

    <div
      id="fillValue"
      class="value">
      0
    </div>

  </div>


  <label>Weight</label>

  <div class="range-row">

    <input
      id="weight"
      type="range"
      min="100"
      max="700"
      step="100"
      value="400"
    >

    <div
      id="weightValue"
      class="value">
      400
    </div>

  </div>


  <label>Grade</label>

  <div class="range-row">

    <input
      id="grade"
      type="range"
      min="-25"
      max="200"
      step="25"
      value="0"
    >

    <div
      id="gradeValue"
      class="value">
      0
    </div>

  </div>


  <label>Optical Size</label>

  <div class="range-row">

    <input
      id="opsz"
      type="range"
      min="20"
      max="48"
      step="4"
      value="24"
    >

    <div
      id="opszValue"
      class="value">
      24
    </div>

  </div>


  <!-- =====================================================
       SELECTED ICON
  ====================================================== -->

  <div class="selected-panel">

    <div
      id="selectedName"
      class="selected-name">
      No icon selected
    </div>

    <div
      id="selectedMeta"
      class="selected-meta">
      Select an icon from the grid.
    </div>


    <div class="preview">

      <div id="previewIcon"></div>

    </div>


    <div class="actions">

      <button id="copySvg">
        COPY SVG
      </button>

      <button id="copyPath">
        COPY PATH
      </button>

    </div>


    <div
      id="status"
      class="status">
    </div>

  </div>

</aside>


<!-- =======================================================
     MAIN
======================================================= -->

<main class="main">

  <div class="topbar">

    <div class="topbar-title">
      Google Material Symbols
    </div>

    <div
      id="count"
      class="count">
      Loading…
    </div>

  </div>


  <div
    id="grid"
    class="grid">

    <div class="loading">
      Loading icon catalogue…
    </div>

  </div>

</main>

</div>


<script>

/* =========================================================
   GOOGLE OFFICIAL DATA
========================================================= */

const METADATA_URL =
  'https://fonts.google.com/metadata/icons?incomplete=1&key=material_symbols';


/*
  Google's own update script uses:

  https://{host}/s/i/short-term/release/
    {stylistic_set_snake}/
    {icon.name}/
    {style}/
    {size_px}px.svg

  We reproduce that exact structure.
*/


const state = {

  style: 'Outlined',

  fill: 0,

  weight: 400,

  grade: 0,

  opsz: 24

};


let icons = [];

let selectedIcon = null;


/* =========================================================
   DOM
========================================================= */

const grid =
  document.getElementById('grid');

const search =
  document.getElementById('search');

const count =
  document.getElementById('count');

const selectedName =
  document.getElementById('selectedName');

const selectedMeta =
  document.getElementById('selectedMeta');

const previewIcon =
  document.getElementById('previewIcon');

const status =
  document.getElementById('status');


/* =========================================================
   STYLE SLUG
========================================================= */

function styleSlug(){

  switch(state.style){

    case 'Rounded':
      return 'materialsymbolsrounded';

    case 'Sharp':
      return 'materialsymbolssharp';

    default:
      return 'materialsymbolsoutlined';

  }

}


/* =========================================================
   GOOGLE SVG STYLE NAME
========================================================= */

function assetStyle(){

  /*
    Google's generator creates:

      default
      fill1
      gradN25
      grad200
      gradN25fill1
      grad200fill1

    And weight prefixes:

      wght100
      wght200
      wght300
      [nothing = 400]
      wght500
      wght600
      wght700
  */

  let result = '';


  /* Weight */

  if(state.weight !== 400){

    result +=
      'wght' +
      state.weight;

  }


  /* Grade */

  if(state.grade === -25){

    result += 'gradN25';

  }

  else if(state.grade === 200){

    result += 'grad200';

  }


  /* Fill */

  if(state.fill === 1){

    result += 'fill1';

  }


  if(!result){

    return 'default';

  }


  return result;
}


/* =========================================================
   GOOGLE SVG URL
========================================================= */

function googleSvgURL(){

  if(!selectedIcon)
    throw new Error(
      'No icon selected.'
    );


  const family =
    styleSlug();

  const icon =
    encodeURIComponent(
      selectedIcon.name
    );

  const variant =
    assetStyle();

  const size =
    state.opsz;


  return (
    'https://fonts.gstatic.com/s/i/short-term/release/' +
    family +
    '/' +
    icon +
    '/' +
    variant +
    '/' +
    size +
    'px.svg'
  );
}


/* =========================================================
   LOAD CATALOGUE
========================================================= */

async function loadCatalogue(){

  try{

    const response =
      await fetch(
        METADATA_URL,
        {
          mode:'cors'
        }
      );


    if(!response.ok){

      throw new Error(
        'Google metadata HTTP ' +
        response.status
      );

    }


    let text =
      await response.text();


    /*
      Google's metadata endpoint starts
      with the anti-XSSI prefix:
      )]}'
    */

    if(
      text.startsWith(")]}'")
    ){

      text =
        text.slice(5);

    }


    const data =
      JSON.parse(text);


    icons =
      Array.isArray(data.icons)
        ? data.icons
        : [];


    icons.sort(
      (a,b) =>
        a.name.localeCompare(b.name)
    );


    renderGrid();


  }catch(error){

    console.error(error);

    grid.innerHTML = `
      <div class="loading">
        Could not load icon catalogue.<br><br>
        ${escapeHTML(error.message)}
      </div>
    `;

    count.textContent =
      'Load error';

  }

}


/* =========================================================
   SEARCH
========================================================= */

function matchesSearch(icon){

  const query =
    search.value
      .trim()
      .toLowerCase();


  if(!query)
    return true;


  const searchable = [

    icon.name || '',

    ...(icon.tags || []),

    ...(icon.categories || [])

  ]
  .join(' ')
  .toLowerCase();


  return searchable.includes(
    query
  );
}


/* =========================================================
   RENDER GRID
========================================================= */

function renderGrid(){

  const filtered =
    icons.filter(
      matchesSearch
    );


  grid.innerHTML = '';


  const fragment =
    document.createDocumentFragment();


  /*
    We render the first 1000 results.

    This keeps the interface responsive when
    the complete Google catalogue is displayed.
  */

  filtered
    .slice(0,1000)
    .forEach(icon => {

      const card =
        document.createElement(
          'div'
        );


      card.className =
        'card';


      if(
        selectedIcon &&
        selectedIcon.name ===
        icon.name
      ){

        card.classList.add(
          'selected'
        );

      }


      const svg =
        document.createElementNS(
          'http://www.w3.org/2000/svg',
          'svg'
        );


      svg.setAttribute(
        'viewBox',
        '0 0 24 24'
      );


      svg.setAttribute(
        'aria-hidden',
        'true'
      );


      /*
        Preview is loaded from Google.
      */

      const img =
        document.createElement(
          'img'
        );


      img.style.width =
        '44px';

      img.style.height =
        '44px';

      img.style.objectFit =
        'contain';

      img.alt = '';


      /*
        Browser preview uses an SVG image
        from the same official endpoint.
      */

      img.src =
        previewURL(
          icon
        );


      img.onerror =
        () => {

          img.style.display =
            'none';

        };


      const name =
        document.createElement(
          'div'
        );


      name.className =
        'card-name';

      name.textContent =
        icon.name;


      card.appendChild(img);

      card.appendChild(name);


      card.addEventListener(
        'click',
        () => {

          selectIcon(icon);

        }
      );


      fragment.appendChild(
        card
      );

    });


  grid.appendChild(
    fragment
  );


  count.textContent =
    filtered.length.toLocaleString() +
    ' / ' +
    icons.length.toLocaleString();

}


/* =========================================================
   PREVIEW URL
========================================================= */

function previewURL(icon){

  const old =
    selectedIcon;

  selectedIcon =
    icon;


  const url =
    googleSvgURL();


  selectedIcon =
    old;


  return url;
}


/* =========================================================
   SELECT
========================================================= */

function selectIcon(icon){

  selectedIcon =
    icon;


  selectedName.textContent =
    icon.name;


  updateSelectedMeta();


  loadPreview();


  status.textContent =
    'Selected ' +
    icon.name;


  renderGrid();

}


/* =========================================================
   SELECTED INFO
========================================================= */

function updateSelectedMeta(){

  if(!selectedIcon)
    return;


  selectedMeta.innerHTML =
    'Style: ' +
    state.style +
    '<br>' +
    'Fill: ' +
    state.fill +
    ' · Weight: ' +
    state.weight +
    ' · Grade: ' +
    state.grade +
    ' · Optical Size: ' +
    state.opsz;

}


/* =========================================================
   LOAD SELECTED PREVIEW
========================================================= */

function loadPreview(){

  previewIcon.innerHTML = '';


  if(!selectedIcon)
    return;


  const img =
    document.createElement(
      'img'
    );


  img.style.width =
    '110px';

  img.style.height =
    '110px';

  img.style.objectFit =
    'contain';


  img.src =
    googleSvgURL();


  img.onload =
    () => {

      status.textContent =
        'Official Google SVG loaded.';

    };


  img.onerror =
    () => {

      status.textContent =
        'This exact Google SVG variant is not available.';

    };


  previewIcon.appendChild(
    img
  );

}


/* =========================================================
   FETCH SVG
========================================================= */

async function fetchSVG(){

  if(!selectedIcon){

    throw new Error(
      'Select an icon first.'
    );

  }


  const url =
    googleSvgURL();


  status.textContent =
    'Fetching official Google SVG…';


  const response =
    await fetch(
      url,
      {
        mode:'cors'
      }
    );


  if(!response.ok){

    throw new Error(
      'Google SVG not available for this combination (' +
      response.status +
      ').'
    );

  }


  const text =
    await response.text();


  if(
    !text.includes('<svg')
  ){

    throw new Error(
      'Google returned an invalid SVG.'
    );

  }


  return text;

}


/* =========================================================
   CLEAN SVG
========================================================= */

function cleanSVG(svgText){

  const parser =
    new DOMParser();


  const doc =
    parser.parseFromString(
      svgText,
      'image/svg+xml'
    );


  const svg =
    doc.documentElement;


  /*
    Remove unnecessary metadata.
  */

  svg
    .querySelectorAll(
      'title,desc,metadata,style'
    )
    .forEach(
      element =>
        element.remove()
    );


  svg.setAttribute(
    'xmlns',
    'http://www.w3.org/2000/svg'
  );


  if(
    !svg.getAttribute(
      'viewBox'
    )
  ){

    svg.setAttribute(
      'viewBox',
      '0 0 24 24'
    );

  }


  /*
    Keep a little provenance information
    inside the exported SVG.
  */

  svg.setAttribute(
    'data-material-symbol',
    selectedIcon.name
  );

  svg.setAttribute(
    'data-material-style',
    state.style
  );

  svg.setAttribute(
    'data-material-fill',
    state.fill
  );

  svg.setAttribute(
    'data-material-weight',
    state.weight
  );

  svg.setAttribute(
    'data-material-grade',
    state.grade
  );

  svg.setAttribute(
    'data-material-opsz',
    state.opsz
  );


  return svg;

}


/* =========================================================
   SERIALIZE
========================================================= */

function serializeSVG(svg){

  return new XMLSerializer()
    .serializeToString(
      svg
    )
    .replace(
      />\s+</g,
      '><'
    );

}


/* =========================================================
   COPY SVG
========================================================= */

document
  .getElementById(
    'copySvg'
  )
  .addEventListener(
    'click',
    async () => {

      try{

        const raw =
          await fetchSVG();


        const svg =
          cleanSVG(
            raw
          );


        const output =
          serializeSVG(
            svg
          );


        await navigator.clipboard
          .writeText(
            output
          );


        status.textContent =
          'SVG copied to clipboard.';


      }catch(error){

        console.error(error);


        status.textContent =
          'SVG extraction error: ' +
          error.message;

      }

    }
  );


/* =========================================================
   COPY PATH
========================================================= */

document
  .getElementById(
    'copyPath'
  )
  .addEventListener(
    'click',
    async () => {

      try{

        const raw =
          await fetchSVG();


        const svg =
          cleanSVG(
            raw
          );


        const paths =
          [
            ...svg.querySelectorAll(
              'path'
            )
          ];


        if(!paths.length){

          throw new Error(
            'No SVG path found.'
          );

        }


        const output =
          paths
            .map(
              path =>
                path.getAttribute('d')
            )
            .filter(Boolean)
            .join('\n');


        await navigator.clipboard
          .writeText(
            output
          );


        status.textContent =
          paths.length +
          ' path' +
          (
            paths.length === 1
              ? ''
              : 's'
          ) +
          ' copied.';


      }catch(error){

        console.error(error);


        status.textContent =
          'PATH extraction error: ' +
          error.message;

      }

    }
  );


/* =========================================================
   SETTINGS
========================================================= */

function updateSettings(){

  state.fill =
    Number(
      document.getElementById(
        'fill'
      ).value
    );


  state.weight =
    Number(
      document.getElementById(
        'weight'
      ).value
    );


  state.grade =
    Number(
      document.getElementById(
        'grade'
      ).value
    );


  state.opsz =
    Number(
      document.getElementById(
        'opsz'
      ).value
    );


  document.getElementById(
    'fillValue'
  ).textContent =
    state.fill;


  document.getElementById(
    'weightValue'
  ).textContent =
    state.weight;


  document.getElementById(
    'gradeValue'
  ).textContent =
    state.grade;


  document.getElementById(
    'opszValue'
  ).textContent =
    state.opsz;


  updateSelectedMeta();


  if(selectedIcon){

    loadPreview();

  }


  renderGrid();

}


/* =========================================================
   RANGE EVENTS
========================================================= */

[
  'fill',
  'weight',
  'grade',
  'opsz'
]
.forEach(
  id => {

    document
      .getElementById(id)
      .addEventListener(
        'input',
        updateSettings
      );

  }
);


/* =========================================================
   STYLE EVENTS
========================================================= */

document
  .querySelectorAll(
    '.style-buttons button'
  )
  .forEach(
    button => {

      button.addEventListener(
        'click',
        () => {

          document
            .querySelectorAll(
              '.style-buttons button'
            )
            .forEach(
              b =>
                b.classList.remove(
                  'active'
                )
            );


          button.classList.add(
            'active'
          );


          state.style =
            button.dataset.style;


          updateSelectedMeta();


          if(selectedIcon){

            loadPreview();

          }


          renderGrid();

        }
      );

    }
  );


/* =========================================================
   SEARCH
========================================================= */

let searchTimer = null;


search.addEventListener(
  'input',
  () => {

    clearTimeout(
      searchTimer
    );


    searchTimer =
      setTimeout(
        renderGrid,
        50
      );

  }
);


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHTML(value){

  return String(value)
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );

}


/* =========================================================
   INIT
========================================================= */

loadCatalogue();

</script>

</body>
</html>

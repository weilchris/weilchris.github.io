<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Material Symbols SVG Extractor</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  color:#eee;
  font-family:Arial,Helvetica,sans-serif;
}

.app{
  width:100%;
  height:100vh;
  display:grid;
  grid-template-columns:330px 1fr;
}

/* ================= SIDEBAR ================= */

.sidebar{
  background:#181818;
  border-right:1px solid #333;
  padding:18px;
  overflow:auto;
}

h1{
  margin:0;
  font-size:20px;
}

.subtitle{
  margin-top:5px;
  color:#777;
  font-size:12px;
  line-height:1.4;
}

label{
  display:block;
  margin-top:17px;
  margin-bottom:6px;
  color:#999;
  font-size:10px;
  letter-spacing:.08em;
  text-transform:uppercase;
}

input[type="text"]{
  width:100%;
  height:38px;
  padding:0 10px;
  border:1px solid #3a3a3a;
  border-radius:7px;
  outline:none;
  background:#222;
  color:#fff;
}

input[type="text"]:focus{
  border-color:#777;
}

/* ================= STYLE ================= */

.style-buttons{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px;
}

.style-buttons button{
  height:35px;
  border:1px solid #3b3b3b;
  border-radius:6px;
  background:#222;
  color:#aaa;
  cursor:pointer;
}

.style-buttons button.active{
  background:#eee;
  color:#111;
  border-color:#eee;
}

/* ================= RANGES ================= */

.range-row{
  display:grid;
  grid-template-columns:1fr 55px;
  gap:8px;
  align-items:center;
}

input[type="range"]{
  width:100%;
}

.value{
  padding:6px 3px;
  border:1px solid #333;
  border-radius:6px;
  background:#222;
  text-align:center;
  font-size:12px;
}

/* ================= SELECTED ================= */

.selected-panel{
  margin-top:22px;
  padding-top:16px;
  border-top:1px solid #333;
}

.selected-name{
  font-size:17px;
  font-weight:bold;
  word-break:break-word;
}

.selected-meta{
  margin-top:6px;
  color:#888;
  font-size:11px;
  line-height:1.55;
}

.preview{
  height:155px;
  margin-top:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid #333;
  border-radius:8px;
  background:#101010;
}

.preview img{
  width:110px;
  height:110px;
  object-fit:contain;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-top:9px;
}

.actions button{
  height:42px;
  border:1px solid #444;
  border-radius:7px;
  background:#252525;
  color:#fff;
  cursor:pointer;
  font-weight:bold;
}

.actions button:hover{
  background:#303030;
}

.status{
  min-height:35px;
  margin-top:9px;
  color:#888;
  font-size:11px;
  line-height:1.4;
}

/* ================= MAIN ================= */

.main{
  min-width:0;
  display:flex;
  flex-direction:column;
}

.topbar{
  height:58px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  border-bottom:1px solid #333;
  background:#151515;
}

.topbar-title{
  font-weight:bold;
}

.count{
  color:#777;
  font-size:12px;
}

.grid{
  flex:1;
  overflow:auto;
  padding:15px;
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(125px,1fr));
  gap:8px;
}

.card{
  min-height:115px;
  padding:10px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  border:1px solid #2d2d2d;
  border-radius:8px;
  background:#181818;
  cursor:pointer;
  transition:.12s;
}

.card:hover{
  border-color:#555;
  background:#222;
}

.card.selected{
  border-color:#aaa;
  background:#252525;
}

.card img{
  width:44px;
  height:44px;
  object-fit:contain;
}

.card-name{
  width:100%;
  margin-top:12px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  text-align:center;
  color:#999;
  font-size:10px;
}

.loading{
  grid-column:1/-1;
  padding:60px;
  color:#777;
  text-align:center;
}

/* ================= RESPONSIVE ================= */

@media(max-width:700px){

  .app{
    grid-template-columns:1fr;
  }

  .sidebar{
    position:absolute;
    z-index:10;
    width:310px;
    height:100%;
    transform:translateX(-100%);
    transition:.2s;
  }

  .sidebar.open{
    transform:translateX(0);
  }
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">

<h1>Material Symbols → SVG</h1>

<div class="subtitle">
Google Material Symbols SVG extractor
</div>

<label>Search</label>

<input
  id="search"
  type="text"
  placeholder="home, arrow, game, volume…"
  autocomplete="off"
>

<label>Style</label>

<div class="style-buttons">

<button class="active" data-style="Outlined">
Outlined
</button>

<button data-style="Rounded">
Rounded
</button>

<button data-style="Sharp">
Sharp
</button>

</div>

<label>Fill</label>

<div class="range-row">

<input
  id="fill"
  type="range"
  min="0"
  max="1"
  step="1"
  value="0"
>

<div id="fillValue" class="value">0</div>

</div>

<label>Weight</label>

<div class="range-row">

<input
  id="weight"
  type="range"
  min="100"
  max="700"
  step="100"
  value="400"
>

<div id="weightValue" class="value">400</div>

</div>

<label>Grade</label>

<div class="range-row">

<input
  id="grade"
  type="range"
  min="-25"
  max="200"
  step="25"
  value="0"
>

<div id="gradeValue" class="value">0</div>

</div>

<label>Optical Size</label>

<div class="range-row">

<input
  id="opsz"
  type="range"
  min="20"
  max="48"
  step="1"
  value="24"
>

<div id="opszValue" class="value">24</div>

</div>

<div class="selected-panel">

<div id="selectedName" class="selected-name">
No icon selected
</div>

<div id="selectedMeta" class="selected-meta">
Select an icon from the grid.
</div>

<div class="preview">
<div id="previewIcon"></div>
</div>

<div class="actions">

<button id="copySvg">
COPY SVG
</button>

<button id="copyPath">
COPY PATH
</button>

</div>

<div id="status" class="status"></div>

</div>

</aside>


<main class="main">

<div class="topbar">

<div class="topbar-title">
Google Material Symbols
</div>

<div id="count" class="count">
Loading…
</div>

</div>

<div id="grid" class="grid">

<div class="loading">
Loading icon catalogue…
</div>

</div>

</main>

</div>


<script>

/* =========================================================
   NO GOOGLE METADATA API
   NO fonts.google.com
   NO CORS PROBLEM FROM GOOGLE METADATA
========================================================= */


/*
  Google's official Material Symbols codepoints file.

  This contains the icon names and their Unicode codepoints.
*/

const CATALOGUE_URL =
  'https://raw.githubusercontent.com/google/material-design-icons/master/variablefont/MaterialSymbolsOutlined%5BFILL%2CGRAD%2Copsz%2Cwght%5D.codepoints';


/*
  Official Google SVG CDN.
*/

const SVG_HOST =
  'https://fonts.gstatic.com/s/i/short-term/release/';


let icons = [];

let selectedIcon = null;


/* =========================================================
   STATE
========================================================= */

const state = {

  style:'Outlined',

  fill:0,

  weight:400,

  grade:0,

  opsz:24

};


/* =========================================================
   DOM
========================================================= */

const grid =
  document.getElementById('grid');

const search =
  document.getElementById('search');

const count =
  document.getElementById('count');

const selectedName =
  document.getElementById('selectedName');

const selectedMeta =
  document.getElementById('selectedMeta');

const previewIcon =
  document.getElementById('previewIcon');

const status =
  document.getElementById('status');


/* =========================================================
   LOAD CATALOGUE
========================================================= */

async function loadCatalogue(){

  try{

    status.textContent =
      'Loading icon catalogue…';


    const response =
      await fetch(
        CATALOGUE_URL,
        {
          cache:'force-cache'
        }
      );


    if(!response.ok){

      throw new Error(
        'Catalogue HTTP ' +
        response.status
      );

    }


    const text =
      await response.text();


    /*
      Format:

      icon_name e145
      icon_name e146

    */

    icons =
      text
        .split(/\r?\n/)
        .map(
          line => {

            const parts =
              line.trim()
                .split(/\s+/);


            if(
              parts.length < 2
            ){

              return null;

            }


            return {

              name:parts[0],

              codepoint:parts[1]

            };

          }
        )
        .filter(Boolean);


    /*
      Remove duplicate names.
    */

    const seen =
      new Set();


    icons =
      icons.filter(
        icon => {

          if(
            seen.has(
              icon.name
            )
          ){

            return false;

          }

          seen.add(
            icon.name
          );

          return true;

        }
      );


    icons.sort(
      (a,b) =>
        a.name.localeCompare(
          b.name
        )
    );


    count.textContent =
      icons.length.toLocaleString() +
      ' icons';


    status.textContent =
      'Catalogue loaded.';


    renderGrid();


  }catch(error){

    console.error(
      error
    );


    grid.innerHTML = '';


    const box =
      document.createElement(
        'div'
      );


    box.className =
      'loading';


    box.innerHTML =
      'Could not load icon catalogue.' +
      '<br><br>' +
      escapeHTML(
        error.message
      );


    grid.appendChild(
      box
    );


    count.textContent =
      'Load error';


    status.textContent =
      error.message;

  }

}


/* =========================================================
   STYLE SLUG
========================================================= */

function styleSlug(){

  return (
    'materialsymbols' +
    state.style.toLowerCase()
  );

}


/* =========================================================
   SVG VARIANT
========================================================= */

function assetStyle(){

  let result = '';


  /*
    Weight
  */

  if(
    state.weight !== 400
  ){

    result +=
      'wght' +
      state.weight;

  }


  /*
    Grade
  */

  if(
    state.grade === -25
  ){

    result +=
      'gradN25';

  }

  else if(
    state.grade === 200
  ){

    result +=
      'grad200';

  }


  /*
    Fill
  */

  if(
    state.fill === 1
  ){

    result +=
      'fill1';

  }


  return result || 'default';

}


/* =========================================================
   OPTICAL SIZE → OFFICIAL SVG SIZE
========================================================= */

function svgSize(){

  const sizes =
    [20,24,40,48];


  let closest =
    sizes[0];


  let difference =
    Math.abs(
      state.opsz -
      closest
    );


  for(
    const size of sizes
  ){

    const d =
      Math.abs(
        state.opsz -
        size
      );


    if(
      d < difference
    ){

      closest =
        size;

      difference =
        d;

    }

  }


  return closest;

}


/* =========================================================
   GOOGLE SVG URL
========================================================= */

function googleSvgURL(icon){

  return (
    SVG_HOST +
    styleSlug() +
    '/' +
    encodeURIComponent(
      icon.name
    ) +
    '/' +
    assetStyle() +
    '/' +
    svgSize() +
    'px.svg'
  );

}


/* =========================================================
   SEARCH
========================================================= */

function matchesSearch(icon){

  const q =
    search.value
      .trim()
      .toLowerCase();


  if(!q)
    return true;


  return icon.name
    .toLowerCase()
    .includes(q);

}


/* =========================================================
   GRID
========================================================= */

function renderGrid(){

  const filtered =
    icons.filter(
      matchesSearch
    );


  grid.innerHTML =
    '';


  /*
    Virtual-ish rendering:

    only create the first 600 visible
    search results at once.
  */

  const visible =
    filtered.slice(
      0,
      600
    );


  const fragment =
    document.createDocumentFragment();


  visible.forEach(
    icon => {

      const card =
        document.createElement(
          'div'
        );


      card.className =
        'card';


      if(
        selectedIcon &&
        selectedIcon.name ===
        icon.name
      ){

        card.classList.add(
          'selected'
        );

      }


      const img =
        document.createElement(
          'img'
        );


      img.alt =
        icon.name;


      /*
        Important:

        <img> does NOT trigger browser CORS
        restrictions in the same way fetch() does.

        Therefore the SVG preview works from
        chrisweil.com even when Google does not
        permit cross-origin fetches.
      */

      img.src =
        googleSvgURL(
          icon
        );


      img.onerror =
        () => {

          img.style.opacity =
            '.15';

        };


      const name =
        document.createElement(
          'div'
        );


      name.className =
        'card-name';


      name.textContent =
        icon.name;


      card.appendChild(
        img
      );


      card.appendChild(
        name
      );


      card.addEventListener(
        'click',
        () =>
          selectIcon(
            icon
          )
      );


      fragment.appendChild(
        card
      );

    }
  );


  grid.appendChild(
    fragment
  );


  count.textContent =
    filtered.length.toLocaleString() +
    ' / ' +
    icons.length.toLocaleString();

}


/* =========================================================
   SELECT
========================================================= */

function selectIcon(icon){

  selectedIcon =
    icon;


  selectedName.textContent =
    icon.name;


  updateSelectedMeta();


  loadPreview();


  status.textContent =
    'Selected ' +
    icon.name;


  renderGrid();

}


/* =========================================================
   META
========================================================= */

function updateSelectedMeta(){

  if(!selectedIcon)
    return;


  selectedMeta.innerHTML =
    'Style: ' +
    state.style +
    '<br>' +
    'Fill: ' +
    state.fill +
    ' · Weight: ' +
    state.weight +
    ' · Grade: ' +
    state.grade +
    ' · Optical Size: ' +
    state.opsz;

}


/* =========================================================
   PREVIEW
========================================================= */

function loadPreview(){

  previewIcon.innerHTML =
    '';


  if(!selectedIcon)
    return;


  const img =
    document.createElement(
      'img'
    );


  img.src =
    googleSvgURL(
      selectedIcon
    );


  img.alt =
    selectedIcon.name;


  img.onload =
    () => {

      status.textContent =
        'Google SVG loaded.';

    };


  img.onerror =
    () => {

      status.textContent =
        'This SVG variant is not available.';

    };


  previewIcon.appendChild(
    img
  );

}


/* =========================================================
   FETCH SVG FOR COPY
========================================================= */

async function fetchSVG(){

  if(!selectedIcon){

    throw new Error(
      'Select an icon first.'
    );

  }


  const url =
    googleSvgURL(
      selectedIcon
    );


  status.textContent =
    'Fetching SVG…';


  /*
    IMPORTANT:

    The SVG endpoint may be displayed as an
    <img> cross-origin, but browser fetch()
    can still be blocked if Google does not
    expose CORS headers.

    We therefore first try fetch().
  */

  const response =
    await fetch(
      url,
      {
        mode:'cors',
        cache:'force-cache'
      }
    );


  if(!response.ok){

    throw new Error(
      'SVG HTTP ' +
      response.status
    );

  }


  return await response.text();

}


/* =========================================================
   CLEAN SVG
========================================================= */

function cleanSVG(text){

  const parser =
    new DOMParser();


  const doc =
    parser.parseFromString(
      text,
      'image/svg+xml'
    );


  const svg =
    doc.documentElement;


  if(
    svg.nodeName
      .toLowerCase() !==
    'svg'
  ){

    throw new Error(
      'Invalid SVG returned.'
    );

  }


  svg.setAttribute(
    'xmlns',
    'http://www.w3.org/2000/svg'
  );


  if(
    !svg.hasAttribute(
      'viewBox'
    )
  ){

    svg.setAttribute(
      'viewBox',
      '0 0 24 24'
    );

  }


  svg.setAttribute(
    'data-material-symbol',
    selectedIcon.name
  );


  svg.setAttribute(
    'data-material-style',
    state.style
  );


  svg.setAttribute(
    'data-material-fill',
    state.fill
  );


  svg.setAttribute(
    'data-material-weight',
    state.weight
  );


  svg.setAttribute(
    'data-material-grade',
    state.grade
  );


  svg.setAttribute(
    'data-material-optical-size',
    state.opsz
  );


  return svg;

}


/* =========================================================
   SERIALIZE
========================================================= */

function serializeSVG(svg){

  return new XMLSerializer()
    .serializeToString(
      svg
    )
    .replace(
      />\s+</g,
      '><'
    );

}


/* =========================================================
   COPY SVG
========================================================= */

document
  .getElementById(
    'copySvg'
  )
  .addEventListener(
    'click',
    async () => {

      try{

        const raw =
          await fetchSVG();


        const svg =
          cleanSVG(
            raw
          );


        const output =
          serializeSVG(
            svg
          );


        await navigator.clipboard
          .writeText(
            output
          );


        status.textContent =
          'SVG copied.';

      }
      catch(error){

        console.error(
          error
        );


        status.textContent =
          'COPY SVG failed: ' +
          error.message;

      }

    }
  );


/* =========================================================
   COPY PATH
========================================================= */

document
  .getElementById(
    'copyPath'
  )
  .addEventListener(
    'click',
    async () => {

      try{

        const raw =
          await fetchSVG();


        const svg =
          cleanSVG(
            raw
          );


        const paths =
          [
            ...svg.querySelectorAll(
              'path'
            )
          ];


        if(
          !paths.length
        ){

          throw new Error(
            'No <path> found.'
          );

        }


        const output =
          paths
            .map(
              p =>
                p.getAttribute(
                  'd'
                )
            )
            .filter(Boolean)
            .join('\n');


        await navigator.clipboard
          .writeText(
            output
          );


        status.textContent =
          'PATH copied.';

      }
      catch(error){

        console.error(
          error
        );


        status.textContent =
          'COPY PATH failed: ' +
          error.message;

      }

    }
  );


/* =========================================================
   SETTINGS
========================================================= */

function updateSettings(){

  state.fill =
    Number(
      document.getElementById(
        'fill'
      ).value
    );


  state.weight =
    Number(
      document.getElementById(
        'weight'
      ).value
    );


  state.grade =
    Number(
      document.getElementById(
        'grade'
      ).value
    );


  state.opsz =
    Number(
      document.getElementById(
        'opsz'
      ).value
    );


  document.getElementById(
    'fillValue'
  ).textContent =
    state.fill;


  document.getElementById(
    'weightValue'
  ).textContent =
    state.weight;


  document.getElementById(
    'gradeValue'
  ).textContent =
    state.grade;


  document.getElementById(
    'opszValue'
  ).textContent =
    state.opsz;


  updateSelectedMeta();


  if(selectedIcon){

    loadPreview();

  }


  renderGrid();

}


/* =========================================================
   RANGE EVENTS
========================================================= */

[
  'fill',
  'weight',
  'grade',
  'opsz'
].forEach(
  id => {

    document
      .getElementById(id)
      .addEventListener(
        'input',
        updateSettings
      );

  }
);


/* =========================================================
   STYLE EVENTS
========================================================= */

document
  .querySelectorAll(
    '.style-buttons button'
  )
  .forEach(
    button => {

      button.addEventListener(
        'click',
        () => {

          document
            .querySelectorAll(
              '.style-buttons button'
            )
            .forEach(
              b =>
                b.classList.remove(
                  'active'
                )
            );


          button.classList.add(
            'active'
          );


          state.style =
            button.dataset.style;


          updateSelectedMeta();


          if(selectedIcon){

            loadPreview();

          }


          renderGrid();

        }
      );

    }
  );


/* =========================================================
   SEARCH
========================================================= */

let searchTimer;


search.addEventListener(
  'input',
  () => {

    clearTimeout(
      searchTimer
    );


    searchTimer =
      setTimeout(
        renderGrid,
        50
      );

  }
);


/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(value){

  return String(value)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');

}


/* =========================================================
   START
========================================================= */

loadCatalogue();

</script>

</body>
</html>

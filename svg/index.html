<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Material Symbols SVG Extractor</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  color:#eee;
  font-family:Arial,Helvetica,sans-serif;
}

.app{
  width:100%;
  height:100vh;
  display:grid;
  grid-template-columns:330px 1fr;
}

/* ================= SIDEBAR ================= */

.sidebar{
  background:#181818;
  border-right:1px solid #333;
  padding:18px;
  overflow:auto;
}

h1{
  margin:0;
  font-size:20px;
}

.subtitle{
  margin-top:5px;
  color:#777;
  font-size:12px;
  line-height:1.4;
}

label{
  display:block;
  margin-top:17px;
  margin-bottom:6px;
  color:#999;
  font-size:10px;
  letter-spacing:.08em;
  text-transform:uppercase;
}

input[type="text"]{
  width:100%;
  height:38px;
  padding:0 10px;
  border:1px solid #3a3a3a;
  border-radius:7px;
  outline:none;
  background:#222;
  color:#fff;
}

input[type="text"]:focus{
  border-color:#777;
}

/* ================= STYLE ================= */

.style-buttons{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px;
}

.style-buttons button{
  height:35px;
  border:1px solid #3b3b3b;
  border-radius:6px;
  background:#222;
  color:#aaa;
  cursor:pointer;
}

.style-buttons button.active{
  background:#eee;
  color:#111;
  border-color:#eee;
}

/* ================= RANGES ================= */

.range-row{
  display:grid;
  grid-template-columns:1fr 65px;
  gap:8px;
  align-items:center;
}

input[type="range"]{
  width:100%;
}

.value{
  padding:6px 3px;
  border:1px solid #333;
  border-radius:6px;
  background:#222;
  text-align:center;
  font-size:12px;
}

/* ================= SELECT ================= */

select{
  width:100%;
  height:35px;
  padding:0 8px;
  border:1px solid #3a3a3a;
  border-radius:6px;
  background:#222;
  color:#eee;
  outline:none;
}

/* ================= SELECTED ================= */

.selected-panel{
  margin-top:22px;
  padding-top:16px;
  border-top:1px solid #333;
}

.selected-name{
  font-size:17px;
  font-weight:bold;
  word-break:break-word;
}

.selected-meta{
  margin-top:6px;
  color:#888;
  font-size:11px;
  line-height:1.55;
}

.preview{
  height:155px;
  margin-top:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid #333;
  border-radius:8px;
  background:#101010;
}

.preview img{
  width:110px;
  height:110px;
  object-fit:contain;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-top:9px;
}

.actions button{
  height:42px;
  border:1px solid #444;
  border-radius:7px;
  background:#252525;
  color:#fff;
  cursor:pointer;
  font-weight:bold;
}

.actions button:hover{
  background:#303030;
}

.status{
  min-height:35px;
  margin-top:9px;
  color:#888;
  font-size:11px;
  line-height:1.4;
}

/* ================= MAIN ================= */

.main{
  min-width:0;
  display:flex;
  flex-direction:column;
}

.topbar{
  height:58px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  border-bottom:1px solid #333;
  background:#151515;
}

.topbar-title{
  font-weight:bold;
}

.count{
  color:#777;
  font-size:12px;
}

.grid{
  flex:1;
  overflow:auto;
  padding:15px;
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(125px,1fr));
  gap:8px;
}

.card{
  min-height:115px;
  padding:10px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  border:1px solid #2d2d2d;
  border-radius:8px;
  background:#181818;
  cursor:pointer;
  transition:.12s;
}

.card:hover{
  border-color:#555;
  background:#222;
}

.card.selected{
  border-color:#aaa;
  background:#252525;
}

.card img{
  width:44px;
  height:44px;
  object-fit:contain;
}

.card-name{
  width:100%;
  margin-top:12px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  text-align:center;
  color:#999;
  font-size:10px;
}

.loading{
  grid-column:1/-1;
  padding:60px;
  color:#777;
  text-align:center;
}

/* ================= COPY FALLBACK ================= */

.copy-overlay{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.72);
}

.copy-box{
  width:min(760px,95vw);
  max-height:90vh;
  padding:16px;
  background:#181818;
  border:1px solid #555;
  border-radius:10px;
  box-shadow:0 20px 70px rgba(0,0,0,.7);
}

.copy-title{
  margin-bottom:8px;
  font-size:13px;
  font-weight:bold;
}

.copy-help{
  margin-bottom:10px;
  color:#888;
  font-size:11px;
}

.copy-textarea{
  width:100%;
  height:260px;
  resize:vertical;
  padding:10px;
  border:1px solid #3a3a3a;
  border-radius:6px;
  outline:none;
  background:#101010;
  color:#eee;
  font-family:monospace;
  font-size:11px;
  line-height:1.45;
}

.copy-buttons{
  display:flex;
  justify-content:flex-end;
  gap:7px;
  margin-top:9px;
}

.copy-buttons button{
  height:36px;
  padding:0 14px;
  border:1px solid #444;
  border-radius:6px;
  background:#252525;
  color:#fff;
  cursor:pointer;
}

.copy-buttons button:hover{
  background:#303030;
}

/* ================= RESPONSIVE ================= */

@media(max-width:700px){

  .app{
    grid-template-columns:1fr;
  }

  .sidebar{
    position:absolute;
    z-index:10;
    width:310px;
    height:100%;
    transform:translateX(-100%);
    transition:.2s;
  }

  .sidebar.open{
    transform:translateX(0);
  }
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">

<h1>Material Symbols → SVG</h1>

<div class="subtitle">
Google Material Symbols SVG extractor
</div>

<label>Search</label>

<input
  id="search"
  type="text"
  placeholder="home, arrow, game, volume…"
  autocomplete="off"
>

<label>Style</label>

<div class="style-buttons">

<button class="active" data-style="Outlined">
Outlined
</button>

<button data-style="Rounded">
Rounded
</button>

<button data-style="Sharp">
Sharp
</button>

</div>

<label>Fill</label>

<div class="range-row">

<input
  id="fill"
  type="range"
  min="0"
  max="1"
  step="1"
  value="0"
>

<div id="fillValue" class="value">0</div>

</div>

<label>Weight</label>

<div class="range-row">

<input
  id="weight"
  type="range"
  min="100"
  max="700"
  step="100"
  value="400"
>

<div id="weightValue" class="value">400</div>

</div>

<label>Grade</label>

<div class="range-row">

<select id="grade">
  <option value="-25">-25</option>
  <option value="0" selected>0</option>
  <option value="200">200</option>
</select>

</div>

<label>Optical Size</label>

<div class="range-row">

<select id="opsz">
  <option value="20">20</option>
  <option value="24" selected>24</option>
  <option value="40">40</option>
  <option value="48">48</option>
</select>

</div>

<div class="selected-panel">

<div id="selectedName" class="selected-name">
No icon selected
</div>

<div id="selectedMeta" class="selected-meta">
Select an icon from the grid.
</div>

<div class="preview">
<div id="previewIcon"></div>
</div>

<div class="actions">

<button id="copySvg">
COPY SVG
</button>

<button id="copyPath">
COPY PATH
</button>

</div>

<div id="status" class="status"></div>

</div>

</aside>


<main class="main">

<div class="topbar">

<div class="topbar-title">
Google Material Symbols
</div>

<div id="count" class="count">
Loading…
</div>

</div>

<div id="grid" class="grid">

<div class="loading">
Loading icon catalogue…
</div>

</div>

</main>

</div>


<script>

/* =========================================================
   MATERIAL SYMBOLS SVG EXTRACTOR
========================================================= */


/* =========================================================
   OFFICIAL GOOGLE CATALOGUE
========================================================= */

const CATALOGUE_URL =
  'https://raw.githubusercontent.com/google/material-design-icons/master/variablefont/MaterialSymbolsOutlined%5BFILL%2CGRAD%2Copsz%2Cwght%5D.codepoints';


/* =========================================================
   GOOGLE SVG CDN
   Used for visual previews.
========================================================= */

const SVG_HOST =
  'https://fonts.gstatic.com/s/i/short-term/release/';


/* =========================================================
   OFFICIAL GOOGLE GITHUB SVG REPOSITORY
   Used for SVG extraction / COPY.
========================================================= */

const GITHUB_SVG_HOST =
  'https://raw.githubusercontent.com/google/material-design-icons/master/symbols/web/';


let icons = [];

let selectedIcon = null;


/* =========================================================
   STATE
========================================================= */

const state = {

  style:'Outlined',

  fill:0,

  weight:400,

  grade:0,

  opsz:24

};


/* =========================================================
   DOM
========================================================= */

const grid =
  document.getElementById('grid');

const search =
  document.getElementById('search');

const count =
  document.getElementById('count');

const selectedName =
  document.getElementById('selectedName');

const selectedMeta =
  document.getElementById('selectedMeta');

const previewIcon =
  document.getElementById('previewIcon');

const status =
  document.getElementById('status');


/* =========================================================
   LOAD CATALOGUE
========================================================= */

async function loadCatalogue(){

  try{

    status.textContent =
      'Loading icon catalogue…';


    const response =
      await fetch(
        CATALOGUE_URL,
        {
          cache:'force-cache'
        }
      );


    if(!response.ok){

      throw new Error(
        'Catalogue HTTP ' +
        response.status
      );

    }


    const text =
      await response.text();


    icons =
      text
        .split(/\r?\n/)
        .map(
          line => {

            const parts =
              line.trim()
                .split(/\s+/);


            if(
              parts.length < 2
            ){

              return null;

            }


            return {

              name:parts[0],

              codepoint:parts[1]

            };

          }
        )
        .filter(Boolean);


    /*
      Remove duplicate names.
    */

    const seen =
      new Set();


    icons =
      icons.filter(
        icon => {

          if(
            seen.has(
              icon.name
            )
          ){

            return false;

          }

          seen.add(
            icon.name
          );

          return true;

        }
      );


    icons.sort(
      (a,b) =>
        a.name.localeCompare(
          b.name
        )
    );


    count.textContent =
      icons.length.toLocaleString() +
      ' icons';


    status.textContent =
      'Catalogue loaded.';


    renderGrid();


  }catch(error){

    console.error(
      error
    );


    grid.innerHTML = '';


    const box =
      document.createElement(
        'div'
      );


    box.className =
      'loading';


    box.innerHTML =
      'Could not load icon catalogue.' +
      '<br><br>' +
      escapeHTML(
        error.message
      );


    grid.appendChild(
      box
    );


    count.textContent =
      'Load error';


    status.textContent =
      error.message;

  }

}


/* =========================================================
   STYLE SLUG
========================================================= */

function styleSlug(){

  return (
    'materialsymbols' +
    state.style.toLowerCase()
  );

}


/* =========================================================
   STYLE DIRECTORY
========================================================= */

function githubStyleDirectory(){

  return styleSlug();

}


/* =========================================================
   VARIANT SUFFIX
========================================================= */

/*
  Google stores generated Material Symbol SVGs
  using filenames such as:

  home_24px.svg
  home_fill1_24px.svg
  home_wght500_24px.svg
  home_gradN25_24px.svg
  home_wght500grad200fill1_24px.svg

  The ordering follows Google's generated
  short-term SVG naming.
*/

function assetStyle(){

  let result = '';


  /*
    Weight
  */

  if(
    state.weight !== 400
  ){

    result +=
      'wght' +
      state.weight;

  }


  /*
    Grade
  */

  if(
    state.grade === -25
  ){

    result +=
      'gradN25';

  }

  else if(
    state.grade === 200
  ){

    result +=
      'grad200';

  }


  /*
    Fill
  */

  if(
    state.fill === 1
  ){

    result +=
      'fill1';

  }


  return result;

}


/* =========================================================
   OPTICAL SIZE
========================================================= */

function svgSize(){

  return Number(
    state.opsz
  );

}


/* =========================================================
   GOOGLE CDN URL
========================================================= */

function googleSvgURL(icon){

  const variant =
    assetStyle();


  return (
    SVG_HOST +
    styleSlug() +
    '/' +
    encodeURIComponent(
      icon.name
    ) +
    '/' +
    (
      variant ||
      'default'
    ) +
    '/' +
    svgSize() +
    'px.svg'
  );

}


/* =========================================================
   GITHUB RAW SVG URL
========================================================= */

function githubSvgURL(icon){

  const variant =
    assetStyle();


  const filename =
    icon.name +
    (
      variant
        ? '_' + variant
        : ''
    ) +
    '_' +
    svgSize() +
    'px.svg';


  return (
    GITHUB_SVG_HOST +
    encodeURIComponent(
      icon.name
    ) +
    '/' +
    githubStyleDirectory() +
    '/' +
    filename
  );

}


/* =========================================================
   SEARCH
========================================================= */

function matchesSearch(icon){

  const q =
    search.value
      .trim()
      .toLowerCase();


  if(!q)
    return true;


  return icon.name
    .toLowerCase()
    .includes(q);

}


/* =========================================================
   GRID
========================================================= */

function renderGrid(){

  const filtered =
    icons.filter(
      matchesSearch
    );


  grid.innerHTML =
    '';


  /*
    Render the first 600 results.
    The complete catalogue remains searchable.
  */

  const visible =
    filtered.slice(
      0,
      600
    );


  const fragment =
    document.createDocumentFragment();


  visible.forEach(
    icon => {

      const card =
        document.createElement(
          'div'
        );


      card.className =
        'card';


      if(
        selectedIcon &&
        selectedIcon.name ===
        icon.name
      ){

        card.classList.add(
          'selected'
        );

      }


      const img =
        document.createElement(
          'img'
        );


      img.alt =
        icon.name;


      /*
        Preview uses Google's CDN.
        <img> is allowed cross-origin
        without exposing the response to JS.
      */

      img.src =
        googleSvgURL(
          icon
        );


      img.onerror =
        () => {

          /*
            If Google CDN preview fails,
            try the official GitHub SVG.
          */

          if(
            img.dataset.githubFallback !==
            '1'
          ){

            img.dataset.githubFallback =
              '1';

            img.src =
              githubSvgURL(
                icon
              );

          }

          else{

            img.style.opacity =
              '.15';

          }

        };


      const name =
        document.createElement(
          'div'
        );


      name.className =
        'card-name';


      name.textContent =
        icon.name;


      card.appendChild(
        img
      );


      card.appendChild(
        name
      );


      card.addEventListener(
        'click',
        () =>
          selectIcon(
            icon
          )
      );


      fragment.appendChild(
        card
      );

    }
  );


  grid.appendChild(
    fragment
  );


  count.textContent =
    filtered.length.toLocaleString() +
    ' / ' +
    icons.length.toLocaleString();

}


/* =========================================================
   SELECT
========================================================= */

function selectIcon(icon){

  selectedIcon =
    icon;


  selectedName.textContent =
    icon.name;


  updateSelectedMeta();


  loadPreview();


  status.textContent =
    'Selected ' +
    icon.name;


  renderGrid();

}


/* =========================================================
   META
========================================================= */

function updateSelectedMeta(){

  if(!selectedIcon)
    return;


  const actualSize =
    svgSize();


  selectedMeta.innerHTML =
    'Style: ' +
    state.style +
    '<br>' +
    'Fill: ' +
    state.fill +
    ' · Weight: ' +
    state.weight +
    ' · Grade: ' +
    state.grade +
    '<br>' +
    'Optical Size: ' +
    state.opsz +
    'px';


}


/* =========================================================
   PREVIEW
========================================================= */

function loadPreview(){

  previewIcon.innerHTML =
    '';


  if(!selectedIcon)
    return;


  const img =
    document.createElement(
      'img'
    );


  img.src =
    googleSvgURL(
      selectedIcon
    );


  img.alt =
    selectedIcon.name;


  img.onload =
    () => {

      status.textContent =
        'Google SVG loaded.';

    };


  img.onerror =
    () => {

      /*
        GitHub fallback.
      */

      if(
        img.dataset.githubFallback !==
        '1'
      ){

        img.dataset.githubFallback =
          '1';

        img.src =
          githubSvgURL(
            selectedIcon
          );

      }

      else{

        status.textContent =
          'This SVG variant is not available.';

      }

    };


  previewIcon.appendChild(
    img
  );

}


/* =========================================================
   FETCH SVG
========================================================= */

async function fetchSVG(){

  if(!selectedIcon){

    throw new Error(
      'Select an icon first.'
    );

  }


  /*
    IMPORTANT:

    We fetch the SVG directly from the
    official Google Material Design Icons
    GitHub repository.

    This avoids the Google Fonts CDN
    CORS restriction encountered on Safari.
  */

  const githubURL =
    githubSvgURL(
      selectedIcon
    );


  status.textContent =
    'Fetching official SVG…';


  try{

    const response =
      await fetch(
        githubURL,
        {
          mode:'cors',
          cache:'force-cache'
        }
      );


    if(
      response.ok
    ){

      return await response.text();

    }


    throw new Error(
      'GitHub SVG HTTP ' +
      response.status
    );

  }
  catch(githubError){

    console.warn(
      'GitHub SVG fetch failed:',
      githubError
    );


    /*
      Secondary fallback:
      try the Google SVG CDN.
    */

    const googleURL =
      googleSvgURL(
        selectedIcon
      );


    const response =
      await fetch(
        googleURL,
        {
          mode:'cors',
          cache:'force-cache'
        }
      );


    if(!response.ok){

      throw new Error(
        'SVG could not be fetched. ' +
        'GitHub: ' +
        githubError.message
      );

    }


    return await response.text();

  }

}


/* =========================================================
   CLEAN SVG
========================================================= */

function cleanSVG(text){

  const parser =
    new DOMParser();


  const doc =
    parser.parseFromString(
      text,
      'image/svg+xml'
    );


  const parserError =
    doc.querySelector(
      'parsererror'
    );


  if(parserError){

    throw new Error(
      'Invalid SVG returned.'
    );

  }


  const svg =
    doc.documentElement;


  if(
    svg.nodeName
      .toLowerCase() !==
    'svg'
  ){

    throw new Error(
      'Invalid SVG returned.'
    );

  }


  svg.setAttribute(
    'xmlns',
    'http://www.w3.org/2000/svg'
  );


  if(
    !svg.hasAttribute(
      'viewBox'
    )
  ){

    svg.setAttribute(
      'viewBox',
      '0 0 24 24'
    );

  }


  svg.setAttribute(
    'data-material-symbol',
    selectedIcon.name
  );


  svg.setAttribute(
    'data-material-style',
    state.style
  );


  svg.setAttribute(
    'data-material-fill',
    state.fill
  );


  svg.setAttribute(
    'data-material-weight',
    state.weight
  );


  svg.setAttribute(
    'data-material-grade',
    state.grade
  );


  svg.setAttribute(
    'data-material-optical-size',
    state.opsz
  );


  return svg;

}


/* =========================================================
   SERIALIZE SVG
========================================================= */

function serializeSVG(svg){

  return new XMLSerializer()
    .serializeToString(
      svg
    )
    .replace(
      />\s+</g,
      '><'
    );

}


/* =========================================================
   COPY TEXT
   Safari-safe implementation
========================================================= */

async function copyText(text){

  /*
    METHOD 1
    Modern Clipboard API.
  */

  try{

    if(
      navigator.clipboard &&
      window.isSecureContext
    ){

      await navigator.clipboard.writeText(
        text
      );

      return true;

    }

  }
  catch(error){

    console.warn(
      'Clipboard API unavailable:',
      error
    );

  }


  /*
    METHOD 2
    Legacy Safari-compatible copy.
  */

  const textarea =
    document.createElement(
      'textarea'
    );


  textarea.value =
    text;


  textarea.setAttribute(
    'readonly',
    ''
  );


  textarea.style.position =
    'fixed';

  textarea.style.left =
    '-9999px';

  textarea.style.top =
    '0';

  textarea.style.width =
    '1px';

  textarea.style.height =
    '1px';

  textarea.style.opacity =
    '0';


  document.body.appendChild(
    textarea
  );


  textarea.focus();

  textarea.select();

  textarea.setSelectionRange(
    0,
    textarea.value.length
  );


  let success =
    false;


  try{

    success =
      document.execCommand(
        'copy'
      );

  }
  catch(error){

    console.warn(
      'execCommand copy failed:',
      error
    );

  }


  textarea.remove();


  if(success){

    return true;

  }


  /*
    METHOD 3
    Guaranteed manual-copy fallback.
  */

  showCopyFallback(
    text
  );


  return false;

}


/* =========================================================
   MANUAL COPY FALLBACK
========================================================= */

function showCopyFallback(text){

  const old =
    document.getElementById(
      'copyFallback'
    );


  if(old){

    old.remove();

  }


  const overlay =
    document.createElement(
      'div'
    );


  overlay.id =
    'copyFallback';


  overlay.className =
    'copy-overlay';


  const box =
    document.createElement(
      'div'
    );


  box.className =
    'copy-box';


  const title =
    document.createElement(
      'div'
    );


  title.className =
    'copy-title';


  title.textContent =
    'COPY FAILED — TEXT READY';


  const help =
    document.createElement(
      'div'
    );


  help.className =
    'copy-help';


  help.textContent =
    'Safari blocked automatic clipboard access. The text is already selected — press ⌘C or Ctrl+C.';


  const textarea =
    document.createElement(
      'textarea'
    );


  textarea.className =
    'copy-textarea';


  textarea.value =
    text;


  const buttons =
    document.createElement(
      'div'
    );


  buttons.className =
    'copy-buttons';


  const copyAgain =
    document.createElement(
      'button'
    );


  copyAgain.textContent =
    'COPY AGAIN';


  copyAgain.onclick =
    async () => {

      try{

        const success =
          await copyTextWithoutFallback(
            text
          );


        if(success){

          overlay.remove();

          status.textContent =
            'Copied.';

        }

      }
      catch(error){

        console.warn(
          error
        );

      }

    };


  const close =
    document.createElement(
      'button'
    );


  close.textContent =
    'CLOSE';


  close.onclick =
    () =>
      overlay.remove();


  buttons.appendChild(
    copyAgain
  );


  buttons.appendChild(
    close
  );


  box.appendChild(
    title
  );

  box.appendChild(
    help
  );

  box.appendChild(
    textarea
  );

  box.appendChild(
    buttons
  );


  overlay.appendChild(
    box
  );


  document.body.appendChild(
    overlay
  );


  textarea.focus();

  textarea.select();

  textarea.setSelectionRange(
    0,
    textarea.value.length
  );


  status.textContent =
    'Clipboard permission denied — text selected for manual copy.';

}


/* =========================================================
   COPY AGAIN
   Does NOT recursively open fallback.
========================================================= */

async function copyTextWithoutFallback(text){

  try{

    if(
      navigator.clipboard &&
      window.isSecureContext
    ){

      await navigator.clipboard.writeText(
        text
      );

      return true;

    }

  }
  catch(error){

    console.warn(
      error
    );

  }


  const textarea =
    document.createElement(
      'textarea'
    );


  textarea.value =
    text;


  textarea.setAttribute(
    'readonly',
    ''
  );


  textarea.style.position =
    'fixed';

  textarea.style.left =
    '-9999px';


  document.body.appendChild(
    textarea
  );


  textarea.focus();

  textarea.select();


  let success =
    false;


  try{

    success =
      document.execCommand(
        'copy'
      );

  }
  catch(error){

    console.warn(
      error
    );

  }


  textarea.remove();


  return success;

}

/* =========================================================
   COPY PATH
========================================================= */

document
  .getElementById(
    'copyPath'
  )
  .addEventListener(
    'click',
    async () => {

      try{

        const raw =
          await fetchSVG();


        const svg =
          cleanSVG(
            raw
          );


        const paths =
          [
            ...svg.querySelectorAll(
              'path'
            )
          ];


        if(
          !paths.length
        ){

          throw new Error(
            'No <path> found.'
          );

        }


        const output =
          paths
            .map(
              p =>
                p.getAttribute(
                  'd'
                )
            )
            .filter(Boolean)
            .join('\n');


        const success =
          await copyText(
            output
          );


        if(success){

          status.textContent =
            'PATH copied.';

        }

      }
      catch(error){

        console.error(
          error
        );


        status.textContent =
          'COPY PATH failed: ' +
          error.message;

      }

    }
  );

/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(value){

  return String(value)
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );

}

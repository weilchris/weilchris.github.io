<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Material Symbols SVG Generator</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  color:#eee;
  font-family:Arial,Helvetica,sans-serif;
}

.app{
  height:100vh;
  display:grid;
  grid-template-columns:330px 1fr;
}

/* ==============================
   SIDEBAR
============================== */

.sidebar{
  background:#181818;
  border-right:1px solid #333;
  padding:18px;
  overflow:auto;
}

h1{
  margin:0;
  font-size:20px;
}

.subtitle{
  margin-top:5px;
  color:#777;
  font-size:12px;
  line-height:1.4;
}

label{
  display:block;
  margin-top:17px;
  margin-bottom:6px;
  color:#999;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.08em;
}

input[type="text"]{
  width:100%;
  height:38px;
  padding:0 10px;
  background:#222;
  border:1px solid #3b3b3b;
  border-radius:7px;
  color:#fff;
  outline:none;
}

input[type="text"]:focus{
  border-color:#777;
}

.style-buttons{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px;
}

.style-buttons button{
  height:34px;
  border-radius:6px;
  border:1px solid #3b3b3b;
  background:#222;
  color:#aaa;
  cursor:pointer;
}

.style-buttons button.active{
  background:#eee;
  color:#111;
  border-color:#eee;
}

.range-row{
  display:grid;
  grid-template-columns:1fr 55px;
  gap:8px;
  align-items:center;
}

input[type="range"]{
  width:100%;
}

.value{
  border:1px solid #333;
  background:#222;
  border-radius:6px;
  padding:6px 3px;
  text-align:center;
  font-size:12px;
}

.selected-panel{
  margin-top:22px;
  padding-top:16px;
  border-top:1px solid #333;
}

.selected-name{
  font-size:17px;
  font-weight:bold;
  word-break:break-word;
}

.selected-meta{
  margin-top:6px;
  color:#888;
  font-size:11px;
  line-height:1.55;
}

.preview{
  margin-top:14px;
  height:155px;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#101010;
  border:1px solid #333;
  border-radius:8px;
}

.preview-icon{
  font-family:
    'Material Symbols Outlined',
    sans-serif;

  font-size:105px;
  line-height:1;

  font-variation-settings:
    'FILL' 0,
    'wght' 400,
    'GRAD' 0,
    'opsz' 24;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-top:9px;
}

.actions button{
  height:42px;
  background:#252525;
  border:1px solid #444;
  color:#fff;
  border-radius:7px;
  cursor:pointer;
  font-weight:bold;
}

.actions button:hover{
  background:#303030;
}

.status{
  min-height:35px;
  margin-top:9px;
  color:#888;
  font-size:11px;
  line-height:1.4;
}

/* ==============================
   MAIN
============================== */

.main{
  min-width:0;
  display:flex;
  flex-direction:column;
}

.topbar{
  height:58px;
  flex:none;
  padding:0 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #333;
  background:#151515;
}

.topbar-title{
  font-weight:bold;
}

.count{
  color:#777;
  font-size:12px;
}

.grid{
  flex:1;
  overflow:auto;
  padding:15px;
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(125px,1fr));
  gap:8px;
}

.card{
  min-height:115px;
  background:#181818;
  border:1px solid #2d2d2d;
  border-radius:8px;
  cursor:pointer;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  padding:10px;
}

.card:hover{
  background:#222;
  border-color:#555;
}

.card.selected{
  background:#252525;
  border-color:#aaa;
}

.card-icon{
  font-family:
    'Material Symbols Outlined',
    sans-serif;

  font-size:42px;
  line-height:1;

  font-variation-settings:
    'FILL' 0,
    'wght' 400,
    'GRAD' 0,
    'opsz' 24;
}

.card-name{
  margin-top:12px;
  width:100%;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  text-align:center;
  color:#999;
  font-size:10px;
}

.loading{
  grid-column:1/-1;
  padding:60px;
  text-align:center;
  color:#777;
}

/* ==============================
   MOBILE
============================== */

@media(max-width:700px){

  .app{
    grid-template-columns:1fr;
  }

  .sidebar{
    position:absolute;
    z-index:20;
    width:310px;
    height:100%;
    transform:translateX(-100%);
    transition:.2s;
  }

  .sidebar.open{
    transform:translateX(0);
  }
}
</style>
</head>

<body>

<div class="app">

  <aside class="sidebar">

    <h1>Material Symbols → SVG</h1>

    <div class="subtitle">
      Exact variable-font glyph extraction
    </div>

    <label>Search</label>

    <input
      id="search"
      type="text"
      placeholder="home, arrow, game, volume…"
      autocomplete="off"
    >

    <label>Style</label>

    <div class="style-buttons">

      <button
        class="active"
        data-style="Outlined">
        Outlined
      </button>

      <button
        data-style="Rounded">
        Rounded
      </button>

      <button
        data-style="Sharp">
        Sharp
      </button>

    </div>

    <label>Fill</label>

    <div class="range-row">

      <input
        id="fill"
        type="range"
        min="0"
        max="1"
        step="1"
        value="0"
      >

      <div
        class="value"
        id="fillValue">
        0
      </div>

    </div>

    <label>Weight</label>

    <div class="range-row">

      <input
        id="weight"
        type="range"
        min="100"
        max="700"
        step="1"
        value="400"
      >

      <div
        class="value"
        id="weightValue">
        400
      </div>

    </div>

    <label>Grade</label>

    <div class="range-row">

      <input
        id="grade"
        type="range"
        min="-50"
        max="200"
        step="1"
        value="0"
      >

      <div
        class="value"
        id="gradeValue">
        0
      </div>

    </div>

    <label>Optical Size</label>

    <div class="range-row">

      <input
        id="opsz"
        type="range"
        min="20"
        max="48"
        step="1"
        value="24"
      >

      <div
        class="value"
        id="opszValue">
        24
      </div>

    </div>


    <div class="selected-panel">

      <div
        id="selectedName"
        class="selected-name">
        No icon selected
      </div>

      <div
        id="selectedMeta"
        class="selected-meta">
        Select an icon.
      </div>

      <div class="preview">

        <span
          id="previewIcon"
          class="preview-icon">
        </span>

      </div>

      <div class="actions">

        <button id="copySvg">
          COPY SVG
        </button>

        <button id="copyPath">
          COPY PATH
        </button>

      </div>

      <div
        id="status"
        class="status">
      </div>

    </div>

  </aside>


  <main class="main">

    <div class="topbar">

      <div class="topbar-title">
        Google Material Symbols
      </div>

      <div
        id="count"
        class="count">
        Loading…
      </div>

    </div>

    <div
      id="grid"
      class="grid">

      <div class="loading">
        Loading Google icon catalogue…
      </div>

    </div>

  </main>

</div>


<!-- =========================================================
     OPENTYPE.JS
========================================================= -->

<script src="https://cdn.jsdelivr.net/gh/opentypejs/opentype.js@master/dist/opentype.js"></script>


<script>
/* =========================================================
   GOOGLE DATA
========================================================= */

const METADATA_URL =
  'https://fonts.google.com/metadata/icons?incomplete=1&key=material_symbols';


const FONT_URLS = {

  Outlined:
    'https://raw.githubusercontent.com/google/material-design-icons/master/variablefont/MaterialSymbolsOutlined%5BFILL%2CGRAD%2Copsz%2Cwght%5D.ttf',

  Rounded:
    'https://raw.githubusercontent.com/google/material-design-icons/master/variablefont/MaterialSymbolsRounded%5BFILL%2CGRAD%2Copsz%2Cwght%5D.ttf',

  Sharp:
    'https://raw.githubusercontent.com/google/material-design-icons/master/variablefont/MaterialSymbolsSharp%5BFILL%2CGRAD%2Copsz%2Cwght%5D.ttf'
};


/* =========================================================
   STATE
========================================================= */

let icons = [];

let selectedIcon = null;

let fontCache = {};

let settings = {

  style:'Outlined',

  fill:0,

  weight:400,

  grade:0,

  opsz:24
};


/* =========================================================
   DOM
========================================================= */

const grid =
  document.getElementById('grid');

const search =
  document.getElementById('search');

const count =
  document.getElementById('count');

const selectedName =
  document.getElementById('selectedName');

const selectedMeta =
  document.getElementById('selectedMeta');

const previewIcon =
  document.getElementById('previewIcon');

const status =
  document.getElementById('status');


/* =========================================================
   GOOGLE FONT CSS
   Used only for live visual preview.
========================================================= */

function loadPreviewFont(){

  const old =
    document.getElementById('materialPreviewFont');

  if(old)
    old.remove();

  const family =
    'Material Symbols ' +
    settings.style;

  const link =
    document.createElement('link');

  link.id =
    'materialPreviewFont';

  link.rel =
    'stylesheet';

  link.href =
    'https://fonts.googleapis.com/css2?family=' +
    encodeURIComponent(family) +
    ':opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap';

  document.head.appendChild(link);
}


/* =========================================================
   VARIATIONS
========================================================= */

function variationString(){

  return [
    "'FILL' " + settings.fill,
    "'wght' " + settings.weight,
    "'GRAD' " + settings.grade,
    "'opsz' " + settings.opsz
  ].join(',');
}


function applyVariation(el){

  if(!el)
    return;

  el.style.fontVariationSettings =
    variationString();
}


/* =========================================================
   LOAD CATALOGUE
========================================================= */

async function loadCatalogue(){

  try{

    const response =
      await fetch(METADATA_URL);

    if(!response.ok)
      throw new Error(
        'Metadata HTTP ' +
        response.status
      );

    let text =
      await response.text();

    /*
      Google metadata has the anti-XSSI prefix.
    */

    if(text.startsWith(")]}'"))
      text = text.slice(5);

    const data =
      JSON.parse(text);

    icons =
      Array.isArray(data.icons)
        ? data.icons
        : [];

    icons.sort(
      (a,b) =>
        a.name.localeCompare(b.name)
    );

    renderGrid();

    count.textContent =
      icons.length.toLocaleString() +
      ' icons';

  }catch(error){

    console.error(error);

    grid.innerHTML =
      '<div class="loading">' +
      'Could not load Google icons.<br><br>' +
      error.message +
      '</div>';

    count.textContent =
      'Error';
  }
}


/* =========================================================
   SEARCH
========================================================= */

function matches(icon){

  const q =
    search.value
      .trim()
      .toLowerCase();

  if(!q)
    return true;

  const text = [

    icon.name || '',

    ...(icon.tags || []),

    ...(icon.categories || [])

  ]
  .join(' ')
  .toLowerCase();

  return text.includes(q);
}


/* =========================================================
   GRID
========================================================= */

function renderGrid(){

  const filtered =
    icons.filter(matches);

  grid.innerHTML = '';

  const fragment =
    document.createDocumentFragment();

  filtered.forEach(icon => {

    const card =
      document.createElement('div');

    card.className =
      'card';

    if(
      selectedIcon &&
      selectedIcon.name === icon.name
    ){
      card.classList.add('selected');
    }

    const symbol =
      document.createElement('span');

    symbol.className =
      'card-icon';

    symbol.textContent =
      icon.name;

    applyVariation(symbol);

    const name =
      document.createElement('div');

    name.className =
      'card-name';

    name.textContent =
      icon.name;

    card.appendChild(symbol);
    card.appendChild(name);

    card.addEventListener(
      'click',
      () => selectIcon(icon)
    );

    fragment.appendChild(card);

  });

  grid.appendChild(fragment);

  count.textContent =
    filtered.length.toLocaleString() +
    ' / ' +
    icons.length.toLocaleString();
}


/* =========================================================
   SELECT ICON
========================================================= */

function selectIcon(icon){

  selectedIcon =
    icon;

  selectedName.textContent =
    icon.name;

  updateSelectedMeta();

  previewIcon.textContent =
    icon.name;

  applyVariation(previewIcon);

  status.textContent =
    'Selected ' + icon.name;

  renderGrid();
}


function updateSelectedMeta(){

  if(!selectedIcon)
    return;

  selectedMeta.innerHTML =
    'Style: ' +
    settings.style +
    '<br>' +
    'FILL ' +
    settings.fill +
    ' · wght ' +
    settings.weight +
    ' · GRAD ' +
    settings.grade +
    ' · opsz ' +
    settings.opsz;
}


/* =========================================================
   LOAD VARIABLE TTF
========================================================= */

async function getFont(){

  const style =
    settings.style;

  if(fontCache[style])
    return fontCache[style];

  status.textContent =
    'Loading ' +
    style +
    ' variable font…';

  const response =
    await fetch(
      FONT_URLS[style]
    );

  if(!response.ok)
    throw new Error(
      'Font HTTP ' +
      response.status
    );

  const buffer =
    await response.arrayBuffer();

  status.textContent =
    'Parsing variable font…';

  const font =
    opentype.parse(buffer);

  fontCache[style] =
    font;

  return font;
}


/* =========================================================
   VARIABLE GLYPH → PATH
========================================================= */

async function createExactPath(){

  if(!selectedIcon)
    throw new Error(
      'Select an icon first.'
    );

  const font =
    await getFont();


  /*
    IMPORTANT:

    Material Symbols are ligature-based icon fonts.

    The icon name itself is passed to getPath().
    opentype.js resolves the GSUB ligature and returns
    the corresponding glyph outline.
  */

  if(
    font.variation &&
    typeof font.variation.set === 'function'
  ){

    font.variation.set({

      FILL:
        settings.fill,

      wght:
        settings.weight,

      GRAD:
        settings.grade,

      opsz:
        settings.opsz

    });

  }


  /*
    Work at a 24px design size.
  */

  const size =
    24;


  const path =
    font.getPath(
      selectedIcon.name,
      0,
      21,
      size,
      {
        kerning:false
      }
    );


  if(!path)
    throw new Error(
      'Could not generate glyph path.'
    );


  return path;
}


/* =========================================================
   PATH COMMANDS
========================================================= */

function pathToD(path){

  return path.commands
    .map(command => {

      switch(command.type){

        case 'M':
          return (
            'M ' +
            clean(command.x) +
            ' ' +
            clean(command.y)
          );

        case 'L':
          return (
            'L ' +
            clean(command.x) +
            ' ' +
            clean(command.y)
          );

        case 'C':
          return (
            'C ' +
            clean(command.x1) +
            ' ' +
            clean(command.y1) +
            ' ' +
            clean(command.x2) +
            ' ' +
            clean(command.y2) +
            ' ' +
            clean(command.x) +
            ' ' +
            clean(command.y)
          );

        case 'Q':
          return (
            'Q ' +
            clean(command.x1) +
            ' ' +
            clean(command.y1) +
            ' ' +
            clean(command.x) +
            ' ' +
            clean(command.y)
          );

        case 'Z':
          return 'Z';

        default:
          return '';

      }

    })
    .filter(Boolean)
    .join(' ');
}


function clean(number){

  if(
    typeof number !== 'number' ||
    !Number.isFinite(number)
  ){
    return '0';
  }

  return Number(
    number.toFixed(4)
  ).toString();
}


/* =========================================================
   EXACT SVG
========================================================= */

async function createExactSVG(){

  const path =
    await createExactPath();

  const d =
    pathToD(path);


  if(!d)
    throw new Error(
      'Generated path is empty.'
    );


  /*
    Material Symbols use a 24 × 24 design grid.

    We keep the SVG completely self-contained.
  */

  return [
    '<svg',
    ' xmlns="http://www.w3.org/2000/svg"',
    ' viewBox="0 0 24 24"',
    ' width="24"',
    ' height="24"',
    ' fill="currentColor"',
    ' data-material-symbol="' +
      escapeAttribute(selectedIcon.name) +
    '"',
    ' data-style="' +
      escapeAttribute(settings.style) +
    '"',
    ' data-fill="' +
      settings.fill +
    '"',
    ' data-weight="' +
      settings.weight +
    '"',
    ' data-grade="' +
      settings.grade +
    '"',
    ' data-optical-size="' +
      settings.opsz +
    '"',
    '>',
    '<path d="' +
      d +
    '"/>',
    '</svg>'
  ].join('');
}


/* =========================================================
   ATTRIBUTE ESCAPE
========================================================= */

function escapeAttribute(value){

  return String(value)
    .replace(/&/g,'&amp;')
    .replace(/"/g,'&quot;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');
}


/* =========================================================
   COPY SVG
========================================================= */

document
  .getElementById('copySvg')
  .addEventListener(
    'click',
    async () => {

      try{

        status.textContent =
          'Generating exact SVG…';

        const svg =
          await createExactSVG();

        await navigator.clipboard.writeText(
          svg
        );

        status.textContent =
          'Exact SVG copied.';

      }catch(error){

        console.error(error);

        status.textContent =
          'SVG extraction failed: ' +
          error.message;
      }

    }
  );


/* =========================================================
   COPY PATH
========================================================= */

document
  .getElementById('copyPath')
  .addEventListener(
    'click',
    async () => {

      try{

        status.textContent =
          'Generating exact path…';

        const path =
          await createExactPath();

        const d =
          pathToD(path);

        await navigator.clipboard.writeText(
          d
        );

        status.textContent =
          'Exact SVG path copied.';

      }catch(error){

        console.error(error);

        status.textContent =
          'Path extraction failed: ' +
          error.message;
      }

    }
  );


/* =========================================================
   SETTINGS
========================================================= */

function updateSettings(){

  settings.fill =
    Number(
      document.getElementById('fill').value
    );

  settings.weight =
    Number(
      document.getElementById('weight').value
    );

  settings.grade =
    Number(
      document.getElementById('grade').value
    );

  settings.opsz =
    Number(
      document.getElementById('opsz').value
    );


  document.getElementById('fillValue')
    .textContent =
      settings.fill;

  document.getElementById('weightValue')
    .textContent =
      settings.weight;

  document.getElementById('gradeValue')
    .textContent =
      settings.grade;

  document.getElementById('opszValue')
    .textContent =
      settings.opsz;


  applyVariation(
    previewIcon
  );

  document
    .querySelectorAll('.card-icon')
    .forEach(
      applyVariation
    );

  updateSelectedMeta();
}


/* =========================================================
   RANGE EVENTS
========================================================= */

[
  'fill',
  'weight',
  'grade',
  'opsz'
]
.forEach(id => {

  document
    .getElementById(id)
    .addEventListener(
      'input',
      updateSettings
    );

});


/* =========================================================
   STYLE
========================================================= */

document
  .querySelectorAll(
    '.style-buttons button'
  )
  .forEach(button => {

    button.addEventListener(
      'click',
      () => {

        document
          .querySelectorAll(
            '.style-buttons button'
          )
          .forEach(
            b =>
              b.classList.remove(
                'active'
              )
          );

        button.classList.add(
          'active'
        );

        settings.style =
          button.dataset.style;

        loadPreviewFont();

        updateSelectedMeta();

        renderGrid();

      }
    );

  });


/* =========================================================
   SEARCH
========================================================= */

let searchTimer;

search.addEventListener(
  'input',
  () => {

    clearTimeout(
      searchTimer
    );

    searchTimer =
      setTimeout(
        renderGrid,
        60
      );

  }
);


/* =========================================================
   INITIALIZE
========================================================= */

loadPreviewFont();

loadCatalogue();

</script>

</body>
</html>
